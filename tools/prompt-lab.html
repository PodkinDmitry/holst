<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Промпт-лаб — конструктор промптов</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Unbounded:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF0F5;--bg2:#FFFFFF;--bg3:#F5F7FB;--line:#D6DCE7;--line2:#C2CAD9;
  --ink:#1B2232;--ink2:#48536B;--ink3:#76819A;
  --hill:#B27A10;--hill-soft:rgba(178,122,16,.12);--on-hill:#FFFFFF;
  --t-result:#2F6DB8;--t-decision:#7547C2;--t-question:#B8436A;--t-action:#1F845A;
  --hi:#C4452C;--mid:#A06C0C;--low:#2F6DB8;
  --shadow:0 20px 50px rgba(27,34,50,.20);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1B2232;--bg2:#222B3E;--bg3:#2A3449;--line:#364259;--line2:#46536E;
    --ink:#E8EBF1;--ink2:#AAB3C6;--ink3:#7B879F;
    --hill:#E9B44C;--hill-soft:rgba(233,180,76,.13);--on-hill:#1B2232;
    --t-result:#89B8F2;--t-decision:#C3A0F2;--t-question:#EF93AC;--t-action:#7DD3A9;
    --hi:#F27B62;--mid:#E9B44C;--low:#89B8F2;
    --shadow:0 20px 50px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1B2232;--bg2:#222B3E;--bg3:#2A3449;--line:#364259;--line2:#46536E;
  --ink:#E8EBF1;--ink2:#AAB3C6;--ink3:#7B879F;
  --hill:#E9B44C;--hill-soft:rgba(233,180,76,.13);--on-hill:#1B2232;
  --t-result:#89B8F2;--t-decision:#C3A0F2;--t-question:#EF93AC;--t-action:#7DD3A9;
  --hi:#F27B62;--mid:#E9B44C;--low:#89B8F2;
  --shadow:0 20px 50px rgba(0,0,0,.5);
  color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.55 "Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.display{font-family:"Unbounded","Golos Text",system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
[data-type="rule"]{--tc:var(--t-decision)}[data-type="lesson"]{--tc:var(--t-result)}
[data-type="hyp"]{--tc:var(--t-question)}[data-type="log"]{--tc:var(--t-action)}[data-type="idea"]{--tc:var(--hill)}

.app{display:grid;grid-template-columns:252px minmax(0,1fr) 336px;max-width:1720px;margin:0 auto}
.nav,.rail{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;max-height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow:auto}
.nav{padding:24px 14px 24px 18px;border-right:1px solid var(--line)}
.rail{padding:24px 20px 24px 18px;border-left:1px solid var(--line)}
.work{padding:26px 34px 90px;min-width:0}
.app.norail{grid-template-columns:252px minmax(0,1fr)}
.app.norail .rail{display:none}
@media (max-width:1180px){
  .app{grid-template-columns:232px minmax(0,1fr)}
  .rail{position:static;grid-column:2;max-height:none;border-left:0;border-top:1px solid var(--line);padding:24px 34px 60px}
}
@media (max-width:760px){
  .app,.app.norail{grid-template-columns:minmax(0,1fr)}
  .nav{position:static;max-height:none;border-right:0;border-bottom:1px solid var(--line);padding:16px}
  .work{padding:20px 16px 36px}
  .rail{grid-column:1;padding:22px 16px 48px}
  .plist{max-height:220px;overflow:auto}
}

/* nav */
.brand{font:600 18px/1.2 "Unbounded",system-ui,sans-serif;margin:0 10px 2px}
.module{margin:0 10px 18px;color:var(--ink3);font-size:13px}
.navlink,.pitem{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:7px 10px;cursor:pointer;color:var(--ink2)}
.navlink:hover,.pitem:hover{background:var(--bg3);color:var(--ink)}
.navlink[aria-current="true"],.pitem[aria-current="true"]{background:var(--bg3);color:var(--ink);box-shadow:inset 2px 0 0 var(--hill)}
.navlink .cnt{margin-left:auto;font-size:12.5px;color:var(--ink3)}
.navlink .ic{width:18px;text-align:center;color:var(--ink3);flex:none}
.pname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sc{flex:none;font:600 10.5px/1 "Unbounded",sans-serif;color:var(--ink3);min-width:22px;text-align:right}
.sc.ok{color:var(--t-action)}
.gdot{flex:none;width:7px;height:7px;border-radius:50%;background:var(--line2)}
.gdot.s-draft{background:var(--ink3)}.gdot.s-ripe{background:var(--mid)}.gdot.s-ready{background:var(--t-action)}.gdot.s-used{background:var(--t-result)}.gdot.s-idea{background:var(--t-question)}
.ghead{margin:18px 10px 5px;font-size:12.5px;color:var(--ink3);display:flex;justify-content:space-between;align-items:center}
.store{margin:18px 10px 0;font-size:12.5px;color:var(--ink3);line-height:1.45}
details.sets>summary{cursor:pointer;margin:16px 10px 4px;font-size:12.5px;color:var(--ink3)}
details.sets .inner{padding:4px 10px 0}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line2);background:var(--bg3);border-radius:9px;padding:8px 14px;cursor:pointer;font-weight:500;font-size:14px;line-height:1.3}
.btn:hover{border-color:var(--ink3)}
.btn.primary{background:var(--hill);border-color:var(--hill);color:var(--on-hill)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink2)}
.btn.ghost:hover{background:var(--bg3)}
.btn.small{padding:5px 10px;font-size:13px}
.btn.full{width:100%}
.btn.big{padding:13px 16px;font-size:15.5px;border-radius:11px}
.btn:disabled{opacity:.5;cursor:default}
.link{background:none;border:0;padding:0;color:var(--hill);cursor:pointer;text-decoration:underline;text-underline-offset:2px;font-size:inherit}
.icon{width:30px;height:30px;flex:none;border-radius:7px;border:1px solid var(--line);background:var(--bg3);cursor:pointer;display:grid;place-items:center;color:var(--ink2);font-size:15px;line-height:1}
.icon:hover{color:var(--ink);border-color:var(--line2)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row.end{justify-content:flex-end}.row.between{justify-content:space-between}
.mt6{margin-top:6px}.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt24{margin-top:24px}
.muted{color:var(--ink3)}.small{font-size:13px}
.seg{display:inline-flex;flex-wrap:wrap;background:var(--bg3);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:5px 11px;border-radius:7px;cursor:pointer;color:var(--ink2);font-size:13.5px}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--bg2);color:var(--ink);box-shadow:0 0 0 1px var(--line2)}
input[type=text],input[type=search],input[type=date],textarea,select{width:100%;background:var(--bg3);border:1px solid var(--line);border-radius:8px;padding:8px 11px;line-height:1.45}
textarea{resize:vertical;min-height:42px;overflow:hidden;display:block}
select{cursor:pointer}
input[type=checkbox]{accent-color:var(--hill);width:16px;height:16px;margin:3px 0 0;flex:none}
:focus-visible,input:focus,textarea:focus,select:focus{outline:2px solid var(--hill);outline-offset:1px}
input::placeholder,textarea::placeholder{color:var(--ink3)}
.chip{display:inline-flex;align-items:center;gap:5px;flex:none;font-size:12.5px;font-weight:500;padding:2px 9px;border-radius:999px;border:1px solid color-mix(in srgb,var(--tc,var(--line2)) 55%,transparent);background:color-mix(in srgb,var(--tc,var(--line2)) 13%,transparent);color:var(--ink);white-space:nowrap}
button.chip{cursor:pointer}
.chip.off{--tc:var(--line2);color:var(--ink2)}
.chip.on{--tc:var(--hill)}
.switch{display:flex;gap:9px;align-items:flex-start;cursor:pointer;font-size:13.5px;color:var(--ink2);margin-top:8px}

/* head */
.thead{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:flex-start;justify-content:space-between}
.tmain{flex:1 1 360px;min-width:0}
.ttitle{font:500 24px/1.3 "Unbounded",system-ui,sans-serif;background:transparent;border:0;border-bottom:1px dashed transparent;border-radius:0;padding:2px 0;width:100%}
.ttitle:focus{outline:none;border-bottom-color:var(--line2)}
.tmeta{color:var(--ink3);font-size:13.5px;margin-top:4px;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.tmeta select{width:auto;padding:3px 8px;font-size:13px}
.h1{font:500 24px/1.3 "Unbounded",system-ui,sans-serif;margin:0 0 6px}
.lead{margin:0;color:var(--ink2);max-width:68ch}

/* blocks */
.sect{margin-top:30px}
.sect>h3,.shead h3{font:600 15.5px/1.35 "Golos Text",sans-serif;margin:0}
.shead{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline;justify-content:space-between;margin-bottom:4px}
.hint{margin:0 0 7px;color:var(--ink3);font-size:13px;line-height:1.45}
.panel{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:14px 16px 16px;margin-top:10px}
.props{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 20px}
.prop .pl{display:block;font-size:13px;color:var(--ink3);margin-bottom:4px}
.prop select{padding:6px 9px;font-size:14px}
.prop.wide{grid-column:1/-1}
@media (max-width:760px){.props{grid-template-columns:minmax(0,1fr)}}
.recs{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line2)}
.recs .lbl{font-size:13px;color:var(--ink3);margin:0 0 6px}
.tplpick{display:flex;flex-wrap:wrap;gap:8px}
.tplpick button{display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:1px;border:1px solid var(--line);background:var(--bg3);border-radius:10px;padding:8px 12px;cursor:pointer;max-width:280px}
.tplpick button:hover{border-color:var(--hill)}
.tplpick button.best{border-color:color-mix(in srgb,var(--hill) 60%,transparent);background:var(--hill-soft)}
.tplpick b{font-weight:500;font-size:14px}.tplpick small{font-size:12.5px;color:var(--ink3);line-height:1.35}
.blk{margin-top:14px}
.blk .bl{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.blk .bl label{font-weight:500;font-size:14.5px}
.blk .bl .len{margin-left:auto;font-size:12px;color:var(--ink3)}
.blk.flag textarea{border-color:color-mix(in srgb,var(--mid) 70%,transparent)}
.blk.req .bl label::after{content:" *";color:var(--hill)}
.techgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}
@media (max-width:760px){.techgrid{grid-template-columns:minmax(0,1fr)}}
.tgroup{margin-top:14px}
.tgroup>p{margin:0 0 6px;font-size:13px;color:var(--ink3)}
.lens{display:flex;gap:10px;align-items:flex-start;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--bg2);cursor:pointer}
.lens b{display:block;font-weight:500;font-size:14px}
.lens small{display:block;color:var(--ink3);font-size:12.5px;line-height:1.4}
.lens:has(input:checked){border-color:color-mix(in srgb,var(--hill) 60%,transparent);background:var(--hill-soft)}
.lens .rec{font-size:11.5px;color:var(--hill);font-weight:600;margin-left:4px}
.preview{white-space:pre-wrap;word-break:break-word;background:var(--bg3);border:1px solid var(--line);border-radius:10px;padding:14px 16px;font:400 13.5px/1.55 "Golos Text",sans-serif;max-height:520px;overflow:auto;margin:10px 0 0}
.preview:empty::before{content:"Пока пусто — заполни задачу или выбери шаблон.";color:var(--ink3)}
.banner{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;margin:12px 0 0;padding:10px 14px;border-radius:10px;background:var(--bg2);border:1px solid var(--line);border-left:3px solid var(--hill);font-size:14px}
.emptybox{padding:16px;border:1px dashed var(--line2);border-radius:12px;margin-top:16px;color:var(--ink2)}
.emptybox p{margin:0 0 10px}

/* ai */
.ai{border-left:3px solid var(--hill)}
.ai h4{margin:14px 0 6px;font-size:14px;font-weight:600}
.ai ul{margin:0;padding-left:18px;color:var(--ink2);font-size:14px}
.ai li{margin-bottom:5px}
.aib{border-top:1px solid var(--line);padding:10px 0}
.aib:first-of-type{border-top:0}
.aib .row{justify-content:space-between}
.aib pre{white-space:pre-wrap;margin:6px 0 0;font:inherit;font-size:14px;color:var(--ink)}
.qa{margin-top:8px}
.qa label{display:block;font-size:14px;margin-bottom:4px}

/* rail */
.ripe{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:16px 16px 14px}
.ripe-top{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.ripe-num{font:500 46px/1 "Unbounded",system-ui,sans-serif;letter-spacing:-.02em}
.ripe-num small{font-size:16px;color:var(--ink3);margin-left:2px}
.ripe-st{text-align:right;font-size:14px;font-weight:500}
.ripe-st small{display:block;font-weight:400;color:var(--ink3);font-size:12.5px}
.ripe-track{position:relative;height:10px;border-radius:6px;background:var(--bg3);border:1px solid var(--line);margin:16px 0 6px;overflow:visible}
.ripe-track i{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:linear-gradient(90deg,color-mix(in srgb,var(--hill) 35%,transparent),var(--hill));transition:width .6s cubic-bezier(.3,.75,.2,1)}
.ripe-track b{position:absolute;top:50%;width:16px;height:16px;border-radius:50%;background:var(--hill);transform:translate(-50%,-50%);box-shadow:0 0 0 5px var(--hill-soft);transition:left .6s cubic-bezier(.3,.75,.2,1)}
.ripe.done .ripe-track i{background:linear-gradient(90deg,color-mix(in srgb,var(--t-action) 35%,transparent),var(--t-action))}
.ripe.done .ripe-track b{background:var(--t-action);box-shadow:0 0 0 5px color-mix(in srgb,var(--t-action) 18%,transparent)}
.ripe-marks{display:grid;grid-template-columns:35fr 25fr 25fr 15fr;font-size:12px;color:var(--ink3)}
.ripe-marks span.cur{color:var(--ink);font-weight:500}
.lint{list-style:none;padding:0;margin:12px 0 0}
.lint li{display:flex;gap:9px;padding:7px 0;border-top:1px solid var(--line);font-size:13.5px;color:var(--ink2);align-items:flex-start}
.lint li:first-child{border-top:0}
.lint .gi{flex:none;width:16px;text-align:center;color:var(--mid);font-weight:600}
.lint li.bad .gi{color:var(--hi)}
.lint b{display:block;color:var(--ink);font-weight:500}
.lint .fix{margin-top:3px}
details.passed>summary{cursor:pointer;font-size:13px;color:var(--t-action);margin-top:8px}
details.passed ul{list-style:none;padding:0;margin:6px 0 0;font-size:13px;color:var(--ink3)}
details.passed li{padding:2px 0}
.copybox{margin-top:16px}
.cstats{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink3);margin-top:7px}
.rcard{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:14px}
.rcard h4{margin:0 0 6px;font-size:14px;font-weight:600}
.fb{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:8px 0}
.fb button{border:1px solid var(--line);background:var(--bg3);border-radius:8px;padding:6px 4px;cursor:pointer;font-size:13px}
.fb button[aria-pressed="true"]{border-color:var(--hill);background:var(--hill-soft)}

/* lists */
.trow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-top:6px}
.trow.done .ttext{text-decoration:line-through;color:var(--ink3)}
.trow .ttext{border:0;background:transparent;padding:4px 2px}
.trow .acts{display:flex;gap:4px;align-items:center}
.pdot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--line2);border:0;padding:0;cursor:pointer}
.pdot.hi{background:var(--hi)}.pdot.mid{background:var(--mid)}.pdot.low{background:var(--low)}
.tstat{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:2px 8px;background:var(--bg3);cursor:pointer;color:var(--ink2);white-space:nowrap}
.tstat.doing{border-color:var(--hill);color:var(--ink);background:var(--hill-soft)}
.dentry{background:var(--bg2);border:1px solid var(--line);border-left:3px solid var(--tc,var(--line2));border-radius:10px;padding:10px 12px;margin-top:8px}
.dentry .dt{white-space:pre-wrap;margin:6px 0 0;font-size:14.5px}
.dentry .dm{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;font-size:12.5px;color:var(--ink3)}
.dentry .dm .sp{margin-left:auto;display:flex;gap:4px}
.dstats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-top:16px}
.dstats div{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.dstats b{display:block;font:500 20px/1.2 "Unbounded",sans-serif}
.dstats span{font-size:12.5px;color:var(--ink3)}
@media (max-width:760px){.dstats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tpl{background:var(--bg2);border:1px solid var(--line);border-radius:11px;padding:11px 14px;margin-top:8px}
.tpl .tn{font-weight:500;font-size:15px;background:none;border:0;padding:0;cursor:pointer;text-align:left}
.tpl .tn:hover{color:var(--hill)}
.tpl p{margin:2px 0 0;font-size:13.5px;color:var(--ink2)}
.tpl .row{margin-top:8px}
.gtitle{margin:26px 0 2px;font:600 14px/1.3 "Golos Text",sans-serif;color:var(--ink2)}
.gtitle small{font-weight:400;color:var(--ink3);margin-left:6px}
.board{display:grid;grid-template-columns:repeat(5,minmax(170px,1fr));gap:10px;margin-top:14px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--bg3);border:1px solid var(--line);border-radius:12px;padding:10px;min-height:120px}
.col h4{margin:0 0 3px;font-size:13.5px;font-weight:600;display:flex;justify-content:space-between}
.col>p{margin:0 0 8px;font-size:12px;color:var(--ink3);line-height:1.35}
.pcard{background:var(--bg2);border:1px solid var(--line);border-radius:9px;padding:8px 10px;margin-bottom:7px;font-size:14px}
.pcard .pt{background:none;border:0;padding:0;text-align:left;cursor:pointer;font-weight:500;width:100%}
.pcard .pt:hover{color:var(--hill)}
.pcard .pm{display:flex;justify-content:space-between;align-items:center;margin-top:6px;font-size:12px;color:var(--ink3)}
.pcard.due{border-color:var(--hill);box-shadow:inset 3px 0 0 var(--hill)}
.principles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
.principles div{background:var(--bg2);border:1px solid var(--line);border-radius:11px;padding:12px 14px}
.principles b{display:block;font-weight:600;font-size:14.5px;margin-bottom:4px}
.principles p{margin:0;font-size:13.5px;color:var(--ink2)}
@media (max-width:760px){.principles{grid-template-columns:minmax(0,1fr)}}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;padding:10px 0;border-top:1px solid var(--line)}
.mrow b{font-weight:500}
.mrow p{margin:2px 0 0;font-size:13.5px;color:var(--ink2)}
.mrow q{display:block;margin-top:5px;font-size:13px;color:var(--ink3);quotes:none;border-left:2px solid var(--line2);padding-left:9px}
.verrow{display:flex;gap:10px;align-items:center;padding:6px 0;border-top:1px solid var(--line);font-size:13.5px}
.verrow:first-child{border-top:0}
.verrow span{flex:1;min-width:0;color:var(--ink2)}
.note{font-size:13.5px;padding:6px 0;border-top:1px solid var(--line)}
.note small{color:var(--ink3);margin-right:8px}

/* overlay */
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:90vw}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.modal{position:fixed;inset:0;background:rgba(15,20,30,.45);display:grid;place-items:center;z-index:50;padding:16px}
.modal[hidden]{display:none}
.mbox{background:var(--bg2);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:18px 20px;width:min(560px,100%);max-height:90vh;overflow:auto}
.mbox h3{margin:0 0 8px;font:500 17px/1.3 "Unbounded",sans-serif}
.mbox p{margin:0 0 12px;color:var(--ink2)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const now=()=>Date.now();
const clone=o=>JSON.parse(JSON.stringify(o==null?null:o));
const fmtD=t=>t?new Date(t).toLocaleDateString('ru-RU',{day:'numeric',month:'short'}):'';
const fmtDT=t=>t?new Date(t).toLocaleString('ru-RU',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'';
const today=()=>new Date().toISOString().slice(0,10);
const tok=s=>{s=s||'';const c=(s.match(/[а-яё]/gi)||[]).length;return Math.round(c/2.4+(s.length-c)/3.8);};
const plural=(n,a,b,c)=>{const m=n%10,h=n%100;return m===1&&h!==11?a:(m>=2&&m<=4&&(h<12||h>14)?b:c);};

const LS='promptlab.v1',LSU='promptlab.ui';
const S={prompts:[],tasks:[],dash:[],tpls:[],set:{markup:'xml',params:true,rules:true,theme:'auto',logRuns:false},mu:0,

function norm(p){const n=Object.assign(newPrompt(),p);n.p=Object.assign({},DEFP,p.p||{});n.b=n.b||{};n.t=(n.t||[]).filter(id=>TK[id]);n.tv=n.tv||{};['notes','v','runs'].forEach(k=>{if(!Array.isArray(n[k]))n[k]=[];});return n;}
function newPrompt(o){return Object.assign({id:uid(),title:'Новый промпт',stage:'draft',p:Object.assign({},DEFP),b:{},t:[],tv:{},raw:null,notes:[],v:[],runs:[],uses:0,rev:'',c:now(),u:now()},o||{});}
const cur=()=>S.prompts.find(x=>x.id===S.cur)||null;
function ensureCur(){
 if(cur())return;
 const live=S.prompts.filter(p=>p.stage!=='arch').sort((a,b)=>b.u-a.u);
 if(live.length){S.cur=live[0].id;return;}
 const p=newPrompt();S.prompts.push(p);S.cur=p.id;Store.touchP(p);
}
function saveUI(){try{localStorage.setItem(LSU,JSON.stringify({view:S.view,cur:S.cur}))}catch(e){}}

const Store={mode:'local',label:'Данные сохраняются в этом браузере.',pcol:null,meta:null,dirty:new Set(),del:new Set(),metaDirty:false,timer:null,busy:false,
 cacheLocal(){try{localStorage.setItem(LS,JSON.stringify({prompts:S.prompts,tasks:S.tasks,dash:S.dash,tpls:S.tpls,set:S.set,mu:S.mu}))}catch(e){}},
 loadLocal(){try{return JSON.parse(localStorage.getItem(LS)||'null')}catch(e){return null}},
 touchP(p){p.u=now();delete p.seed;this.dirty.add(p.id);this.sched();},
 touchM(){S.mu=now();this.metaDirty=true;this.sched();},
 sched(ms){clearTimeout(this.timer);this.timer=setTimeout(()=>this.flush(),ms||700);},
 async flush(){
  this.cacheLocal();
  if(this.mode!=='cloud')return;
  if(this.busy){this.sched(500);return;}
  this.busy=true;
  const ids=[...this.dirty];this.dirty.clear();const dels=[...this.del];this.del.clear();const md=this.metaDirty;this.metaDirty=false;
  try{
   for(const id of ids){const p=S.prompts.find(x=>x.id===id);if(p)await this.pcol.doc(id).set(clone(p));}
   for(const id of dels)await this.pcol.doc(id).delete();
   if(md)await this.meta.set(clone({tasks:S.tasks,dash:S.dash,tpls:S.tpls,set:S.set,mu:S.mu}));
   if(this.err){this.err=false;this.label='Сохраняется в облаке Claude — доступно с любого устройства.';rNav();}
  }catch(e){
   ids.forEach(i=>this.dirty.add(i));dels.forEach(i=>this.del.add(i));if(md)this.metaDirty=true;
   this.err=true;this.label=(e&&e.code==='quota_exceeded')?'Облако заполнено — удали лишнее. Пока сохраняю в этом браузере.':'Облако не приняло запись — повторю. Копия есть в этом браузере.';rNav();
   if(!(e&&(e.code==='quota_exceeded'||e.code==='invalid_argument')))this.sched(6000);
  }finally{this.busy=false;}
 },
 setMode(m,l){this.mode=m;this.label=l;rNav();},
 async connect(){
  if(!(window.claude&&typeof window.claude.use==='function')){this.setMode('local','Страница открыта вне Claude — данные только в этом браузере.');return;}
  let db=null,user=null;
  try{[db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);}catch(e){}
  if(!db||!user){this.setMode('local','Облако недоступно в этом окне — данные в этом браузере.');return;}
  let id=null;try{id=await user.id();}catch(e){}
  if(!id){this.setMode('local','Облако недоступно — данные в этом браузере.');return;}
  try{
   const base=db.doc('data/users/'+id+'/promptlab');
   this.pcol=base.collection('prompts');this.meta=base.collection('meta').doc('main');
   const [qs,ms]=await Promise.all([this.pcol.get(),this.meta.get()]);
   const remote={};qs.docs.forEach(d=>{if(d.exists){const v=clone(d.data());if(v&&v.id)remote[v.id]=norm(v);}});
   const hasRemote=Object.keys(remote).length>0;
   const local={};S.prompts.forEach(p=>{if(!(p.seed&&hasRemote))local[p.id]=p;});
   const merged=[];
   Object.keys(remote).forEach(k=>{const r=remote[k],l=local[k];if(l&&(l.u||0)>(r.u||0)){merged.push(l);this.dirty.add(k);}else merged.push(r);delete local[k];});
   Object.values(local).forEach(l=>{merged.push(l);this.dirty.add(l.id);});
   S.prompts=merged;
   if(ms.exists){const m=clone(ms.data())||{};

/* ================= СБОРКА ПРОМПТА ================= */
function techText(t,p){
 if(!t.ph)return t.s;
 const v=((p.tv||{})[t.id]||'').trim();

}
function phLabel(t){const m=t.s.match(/\[([^\]]+)\]/);return m?m[1]:'';}
function paramLines(p){

 if(P.out==='file'&&!T.has('fullfile'))L.push('Нужен готовый файл целиком — рабочая сборка, без пропусков и сокращений.');
 if(P.out==='frag'&&!T.has('onlydiff'))L.push('Покажи только изменённые фрагменты и где они стоят. Остальное не переписывай.');
 if(P.out==='artifact')L.push('Сделай результат интерактивным HTML-артефактом в одном файле.');
 if(P.vol==='short')L.push('Объём: коротко — до 150 слов.');
 if(P.vol==='mid')L.push('Объём: средний — до 500 слов.');
 if(P.vol==='long')L.push('Объём: подробно, но без воды — каждый абзац добавляет новое.');
 if(P.think==='step'&&!T.has('steps'))L.push('Рассуждай пошагово, затем дай итог.');
 if(P.think==='deep')L.push('Сначала разбери задачу: допущения, варианты, риски. Потом реши и коротко объясни выбор.');
 if(P.stakes==='high')L.push('Ставки высокие: отметь, в чём не уверен, и проверь выводы на слабые допущения.');
 if(P.session==='cont'&&!T.has('keyfacts'))L.push('Это продолжение работы: опирайся на принятые решения и не пересматривай их без причины.');
 if(P.lang==='en')L.push('Отвечай на английском.');
 return L;
}
const pinned=()=>S.dash.filter(d=>d.type==='rule'&&d.pin);
function parts(p){
 const B=p.b||{},out=[];
 const add=(k,label,xml,text)=>{text=String(text||'').trim();if(text)out.push({k,label,xml,text});};
 const long=(B.materials||'').trim().length>1500;
 add('role','Роль','role',B.role);
 if(long)add('materials','Материалы','materials',B.materials);
 add('context','Контекст','context',B.context);
 if(!long)add('materials','Материалы','materials',B.materials);
 ['task','constraints','nongoals','examples','format','criteria','extra'].forEach(k=>add(k,BK[k].n,BK[k].xml,B[k]));
 const how=[...(S.set.params?paramLines(p):[]),...(p.t||[]).map(id=>TK[id]).filter(Boolean).map(t=>techText(t,p))];
 if(how.length)add('how','Как работать','instructions',how.map(x=>'- '+x).join('\n'));
 if(S.set.rules&&p.useRules!==false){const r=pinned();if(r.length)add('rules','Мои постоянные правила','my_rules',r.map(x=>'- '+x.text.trim()).join('\n'));}
 return out;
}
function assemble(p,force){
 if(!p)return '';
 if(p.raw!=null&&!force)return p.raw;
 const ps=parts(p),m=S.set.markup;
 if(m==='xml')return ps.map(x=>`<${x.xml}>\n${x.text}\n</${x.xml}>`).join('\n\n');
 if(m==='md')return ps.map(x=>`## ${x.label}\n${x.text}`).join('\n\n');
 return ps.map(x=>x.k==='task'&&!x.text.includes('\n')?x.text:(x.text.includes('\n')?`${x.label}:\n${x.text}`:`${x.label}: ${x.text}`)).join('\n\n');

/* ================= ЗРЕЛОСТЬ ================= */
function collectPh(p){
 const set=new Set(),re=/\[([^\]\n]{1,60})\]/g;
 BLOCKS.forEach(b=>{const s=(p.b||{})[b.k]||'';let m;re.lastIndex=0;while((m=re.exec(s)))set.add(m[0]);});
 (p.t||[]).forEach(id=>{const t=TK[id];if(t&&t.ph&&!((p.tv||{})[id]||'').trim())set.add('['+phLabel(t)+']');});
 return [...set];
}
function findVague(B){
 const found=[];let blk=null;
 ['task','criteria','format'].forEach(k=>{const s=(B[k]||'').toLowerCase();VAGUE.forEach(st=>{const re=new RegExp('(^|[^а-яё])('+st.replace('-','\\-')+'[а-яё]*)','i');const m=s.match(re);if(m&&!found.includes(m[2])){found.push(m[2]);if(!blk)blk=k;}});});
 return {found,blk};
}
function lint(p){
 const B=p.b||{},P=p.p,T=new Set(p.t||[]),L=[],len=k=>(B[k]||'').trim().length;
 const add=(id,ok,w,n,tip,act,arg)=>L.push({id,ok,w,n,tip,act,arg});
 add('task',len('task')>=12,3,'Задача сформулирована','Одно главное действие глаголом: «составь», «найди», «перепиши».','focus','task');
 const ex=P.mode==='explore';
 add('ctx',ex?len('context')>=80:(len('context')>=40||len('materials')>=40),2,ex?'Контекст выгружен':'Есть контекст',ex?'Выгрузи всё, что есть: ситуация, что не устраивает, что пробовал. Без структуры — это сырьё.':'Опиши ситуацию: что есть, что не устраивает, зачем это нужно.','focus','context');
 add('crit',len('criteria')>=12||(ex&&(T.has('interview')||T.has('restate'))),2,'Есть критерий успеха','Как поймёшь, что результат хороший? Проверяемо, без «хорошо».','focus','criteria');
 add('fmt',len('format')>=10||['file','frag','artifact'].includes(P.out)||(ex&&len('criteria')>=12),1.5,'Задан формат ответа','В каком виде нужен результат: таблица, список, текст, файл.','focus','format');
 if(!ex)add('vol',P.vol!=='auto'||P.out==='frag'||/\d+\s*(слов|строк|абзац|пункт|предлож|символ|знак|вариант|раздел|идей|колон)/i.test(B.format||''),1,'Задан объём','Без объёма Claude решит сам — обычно длиннее, чем нужно.','prop','vol');
 if(!ex)add('bounds',len('constraints')>=8||len('nongoals')>=8,1,'Есть рамки','Что нельзя менять и чего не делать.','focus','constraints');
 if(ex)add('exp',T.has('interview')||T.has('restate')||T.has('forks')||T.has('variants'),2,'Метод прояснения','В режиме прояснения включи «Вопросы по одному», иначе Claude сразу начнёт решать.','tech','interview');
 if(len('materials')>=40)add('lbl',T.has('labels')||T.has('quotes')||T.has('contra'),1,'Привязка к материалам','Попроси помечать, что взято из материалов, а что — догадка.','tech','labels');
 const phs=collectPh(p);
 if(phs.length)add('ph',false,2,'Остались поля в скобках','Заполни: '+phs.slice(0,4).join(', ')+(phs.length>4?' и ещё '+(phs.length-4):''),'nextph');
 const vg=findVague(B);
 if(vg.found.length)add('vague',false,1.5,'Оценочные слова без меры','«'+vg.found.join('», «')+'» — замени измеримым: число, пример, критерий.','focus',vg.blk);
 if(/(больше|максимальн|как можно|по максимуму)/i.test(B.task||''))add('trap',false,1,'Ловушка объёма','«Больше» и «максимально» модель понимает буквально и производит объём. Лучше: «одно главное», «что удалить».','tech','oneaction');
 if(/(^|[.!?\n]\s*)(это|он|она|оно|они|там|его|её|их|этот|эта|такое)\s/i.test(B.task||''))add('pron',false,0.5,'Местоимение без опоры','Фраза в задаче начинается с «это», «его», «там» — назови объект прямо.','focus','task');
 if(((B.task||'').match(/\?/g)||[]).length>3)add('multi',false,1,'Много вопросов сразу','Больше трёх вопросов в одной задаче — пронумеруй или раздели на шаги.','focus','task');
 if((T.has('fullfile')&&(T.has('onlydiff')||P.out==='frag'))||(T.has('onlydiff')&&P.out==='file'))add('conf',false,2,'Противоречие','«Файл целиком» и «только правки» одновременно. Оставь одно.','prop','out');
 const total=assemble(p,true).length;
 if(total>0&&total<90&&P.vol!=='short')add('short',false,1,'Слишком коротко','Короткий промпт — Claude додумает остальное по-своему.','focus','context');
 if(total>15000)add('long',false,1,'Очень длинный промпт','Каждый следующий ход перечитывает его. Постоянное вынеси в инструкции проекта, материалы — в файлы.');
 const sw=L.reduce((a,x)=>a+x.w,0),ow=L.reduce((a,x)=>a+(x.ok?x.w:0),0);
 let score=sw?Math.round(ow/sw*100):0;
 if(!(B.task||'').trim())score=Math.min(score,20);
 return {score,items:L};
}

function recTpl(P){
 return TPL.concat(S.tpls).map(t=>{let s=0;const tp=t.p||{};
  if(tp.type&&tp.type===P.type&&P.type!=='other')s+=5;
  if(P.mode==='explore'){if(t.g==='explore')s+=6;}else if(t.g==='explore'&&t.id!=='x5')s-=4;
  if(tp.out&&tp.out===P.out&&P.out!=='chat')s+=2;
  if(tp.data&&tp.data===P.data&&P.data==='yes')s+=1;
  if(tp.stakes&&tp.stakes===P.stakes&&P.stakes==='high')s+=1;
  if(P.session==='cont'&&tp.session==='cont')s+=1;
  if(tp.vol&&tp.vol===P.vol&&P.vol!=='auto')s+=1;
  return {t,s};}).filter(x=>x.s>=4).sort((a,b)=>b.s-a.s).slice(0,4).map(x=>x.t);
}
function recTech(P){
 const R=new Set();
 if(P.mode==='explore'){R.add('interview');R.add('idk');}

 if(P.out==='artifact')R.add('plan_first');
 if(P.vol==='short')R.add('nopre');
 if(P.session==='cont')R.add('keyfacts');
 if(P.think==='deep'&&P.stakes==='high')R.add('redteam');
 ({decide:['redteam','oneaction'],plan:['oneaction','deletable','defer'],ideas:['variants','test'],code:['plan_first','selfcheck','stages'],research:['search','idk'],review:['redteam','deletable'],system:['terms','nopre'],write:['ru_style'],edit:['ru_style','terms'],msg:['ru_style'],analyze:['labels','contra','idk'],doc:['quotes','idk'],learn:['steps']}[P.type]||[]).forEach(x=>R.add(x));
 if(P.out==='frag')R.delete('fullfile');
 return [...R];
}
function setTech(p,id,on){

/* ================= ПРАВАЯ КОЛОНКА ================= */
function rRail(){
 const rail=$('rail');
 if(S.view!=='build'){rail.innerHTML='';return;}
 const p=cur();if(!p){rail.innerHTML='';return;}
 const L=lint(p),lv=level(L.score),txt=assemble(p),bad=L.items.filter(i=>!i.ok),good=L.items.filter(i=>i.ok);
 const marks=['Зерно','Росток','Наливается','Созрел'],ci=marks.indexOf(lv[0]);
 const fixBtn=i=>i.act==='focus'?`<button class="link small" data-act="focus" data-k="${i.arg}">к блоку</button>`:i.act==='tech'?`<button class="link small" data-act="tech-on" data-id="${i.arg}">включить «${esc(TK[i.arg].n)}»</button>`:i.act==='nextph'?`<button class="link small" data-act="nextph">к первому полю</button>`:i.act==='prop'?`<button class="link small" data-act="focus-props">к свойствам</button>`:'';
 let fb='';
 if(S.justCopied===p.id){fb=`<div class="rcard"><h4>Как сработал этот промпт?</h4><p class="hint" style="margin:0">Итог запуска — то, что делает следующий промпт лучше.</p><div class="fb">${[['ok','Сработал'],['mid','Частично'],['bad','Нет']].map(o=>`<button data-act="fb" data-v="${o[0]}" aria-pressed="${S.fbRes===o[0]}">${o[1]}</button>`).join('')}</div><textarea id="fbNote" rows="2" placeholder="Что поправить в следующий раз?">${esc(S.fbNote)}</textarea><div class="row mt8"><button class="btn small primary" data-act="fb-save" ${S.fbRes?'':'disabled'}>Записать в DASH</button><button class="btn small ghost" data-act="fb-skip">Позже</button></div></div>`;}
 rail.innerHTML=`<div class="ripe${L.score>=85?' done':''}"><div class="ripe-top"><div class="ripe-num">${L.score}<small>/100</small></div><div class="ripe-st">${lv[0]}<small>${lv[1]}</small></div></div>
 <div class="ripe-track" role="img" aria-label="Зрелость ${L.score} из 100"><i style="width:${L.score}%"></i><b style="left:${Math.max(2,Math.min(98,L.score))}%"></b></div>
 <div class="ripe-marks">${marks.map((m,i)=>`<span class="${i===ci?'cur':''}">${m}</span>`).join('')}</div>
 ${bad.length?`<ul class="lint">${bad.map(i=>`<li class="${i.w>=2?'bad':''}"><span class="gi">${i.w>=2?'!':'·'}</span><span><b>${esc(i.n)}</b>${esc(i.tip)}<div class="fix">${fixBtn(i)}</div></span></li>`).join('')}</ul>`:''}
 ${good.length?`<details class="passed"><summary>Выполнено: ${good.length}</summary><ul>${good.map(i=>`<li>✓ ${esc(i.n)}</li>`).join('')}</ul></details>`:''}</div>
 <div class="copybox"><button class="btn primary big full" data-act="copy" ${txt.trim()?'':'disabled'}>Скопировать промпт</button>
 <div class="cstats"><span>≈ ${tok(txt)} ${plural(tok(txt),'токен','токена','токенов')}</span><span>${txt.length} зн.</span><span>Ctrl+Enter</span></div></div>
 ${fb}
 ${S.ai&&!S.aiBusy?`<button class="btn full mt12" data-act="ai-run">Улучшить с Claude</button>`:''}
 ${pinned().length&&S.set.rules?`<div class="rcard"><h4>Правила из DASH в промпте</h4><label class="switch" style="margin-top:0"><input type="checkbox" data-act="use-rules" ${p.useRules!==false?'checked':''}><span>${pinned().length} ${plural(pinned().length,'правило','правила','правил')} в этом промпте</span></label></div>`:''}
 ${linkedTasks(p)}`;
}
function linkedTasks(p){
 const ts=S.tasks.filter(t=>t.pid===p.id);if(!ts.length)return '';
 return `<div class="rcard"><h4>Задачи этого промпта</h4>${ts.map(t=>`<label class="switch" style="margin-top:4px"><input type="checkbox" data-act="task-done" data-id="${t.id}" ${t.st==='done'?'checked':''}><span>${esc(t.text)}</span></label>`).join('')}</div>`;
}

/* ================= ШАБЛОНЫ ================= */
function tplMatch(t,q){if(!q)return true;q=q.toLowerCase();return (t.n+' '+t.d+' '+Object.values(t.b||{}).join(' ')).toLowerCase().includes(q);}
function tplListHTML(){
 const all=TPL.concat(S.tpls),q=S.tplQ.trim();
 const groups=TPLG.filter(g=>S.tplG==='all'||S.tplG===g[0]);
 let h='';
 groups.forEach(g=>{const items=all.filter(t=>t.g===g[0]&&tplMatch(t,q));if(!items.length)return;
  h+=`<h3 class="gtitle">${esc(g[1])}${g[2]?`<small>${esc(g[2])}</small>`:''}</h3>`;
  h+=items.map(t=>{const open=S.tplOpen===t.id;const tp=Object.assign({},DEFP,t.p||{});
   return `<div class="tpl"><button class="tn" data-act="tpl-open" data-id="${t.id}" aria-expanded="${open}">${esc(t.n)}</button><p>${esc(t.d)}</p>
   <div class="row"><span class="chip">${esc(TYPEN[tp.type]||'Любая задача')}</span>${tp.mode==='explore'?'<span class="chip" style="--tc:var(--t-question)">прояснение</span>':''}${(t.t||[]).slice(0,4).map(id=>TK[id]?`<span class="chip off">${esc(TK[id].n)}</span>`:'').join('')}
   <span style="margin-left:auto" class="row"><button class="btn small" data-act="apply-tpl" data-id="${t.id}">Применить</button><button class="btn small ghost" data-act="tpl-new" data-id="${t.id}">В новый промпт</button>${t.g==='mine'?`<button class="btn small ghost" data-act="tpl-del" data-id="${t.id}">Удалить</button>`:''}</span></div>
   ${open?`<pre class="preview">${esc(assemble(Object.assign(newPrompt(),{p:tp,b:clone(t.b||{}),t:[...(t.t||[])],tv:{}})))}</pre>`:''}</div>`;}).join('');
 });
 return h||`<div class="emptybox"><p>Ничего не нашлось по запросу «${esc(q)}».</p><button class="btn small" data-act="tpl-clear">Сбросить поиск</button></div>`;
}
function vTpl(){
 return `<h1 class="h1">Шаблоны</h1><p class="lead">На все виды запросов. «Применить» заменяет блоки текущего промпта (прежняя версия сохранится), «В новый промпт» — создаёт отдельный. Поля в [скобках] заполни своим.</p>

 <div class="mt12">${seg('tpl-g','',[['all','Все']].concat(TPLG.filter(g=>g[0]!=='mine'||S.tpls.length).map(g=>[g[0],g[1].split(':')[0]])),S.tplG)}</div>
 <div id="tplList">${tplListHTML()}</div>`;

 return `<h1 class="h1">Методы</h1><p class="lead">Принципы, на которых держится конструктор, и все приёмы улучшения промпта. «Добавить» включает приём в текущий промпт «${esc(p?p.title:'')}».</p>

 ${TG.map(g=>`<h3 class="gtitle">${g[1]}</h3>${TECH.filter(t=>t.g===g[0]).map(t=>`<div class="mrow"><div><b>${esc(t.n)}</b><p>${esc(t.d)}</p><q>${esc(t.s)}</q></div><div>${T.has(t.id)?`<button class="chip on" data-act="tech" data-id="${t.id}">✓ В промпте</button>`:`<button class="chip off" data-act="tech" data-id="${t.id}">+ Добавить</button>`}</div></div>`).join('')}`).join('')}
 <h3 class="gtitle">Проверки зрелости</h3><p class="lead small">Зрелость считается из того, что есть в промпте: задача, контекст, критерий успеха, формат, объём, рамки. Снижают её поля в скобках, оценочные слова без меры («хорошо», «качественно», «подробно»), «больше» и «максимально» в задаче, местоимения без опоры, больше трёх вопросов в задаче и противоречивые указания. В режиме прояснения нужен метод прояснения, при материалах — привязка к ним.</p>`;

 <div class="row mt16"><input type="text" id="ideaNew" placeholder="Идея для промпта — Enter" style="flex:1 1 240px;width:auto"><button class="btn small" data-act="idea-add">В идеи</button><label class="switch" style="margin:0 0 0 8px"><input type="checkbox" data-act="show-arch" ${S.showArch?'checked':''}><span>Показать архив</span></label></div>

/* ================= ЗАДАЧИ ================= */

 return `<h1 class="h1">Задачи</h1><p class="lead">Мини-задачник: что сделать и какой промпт для этого нужен. Из задачи можно сразу собрать промпт — текст задачи станет блоком «Задача».</p>
 <div class="panel"><div class="row" style="flex-wrap:nowrap"><input type="text" id="taskNew" placeholder="Новая задача — Enter"><button class="btn primary small" data-act="task-add">Добавить</button></div>
 <div class="row mt8"><span class="small muted">Приоритет</span>${seg('task-prio','',[['hi','Высокий'],['mid','Средний'],['low','Низкий']],S.taskPrio)}</div></div>
 <div class="row mt16 between">${seg('task-f','',[['open','Открытые'],['all','Все'],['done','Готово']],S.taskF)}<span class="small muted">${S.tasks.filter(t=>t.st!=='done').length} открыто</span></div>
 ${list.length?list.map(t=>{const lp=t.pid&&S.prompts.find(p=>p.id===t.pid);return `<div class="trow${t.st==='done'?' done':''}"><input type="checkbox" data-act="task-done" data-id="${t.id}" ${t.st==='done'?'checked':''} aria-label="Готово">
 <div><input type="text" class="ttext" data-tk="${t.id}" value="${esc(t.text)}"><div class="small muted">${fmtD(t.c)}${lp?`, промпт <button class="link" data-act="open" data-id="${lp.id}">${esc(lp.title)}</button>`:''}</div></div>
 <div class="acts"><button class="pdot ${t.pr}" data-act="task-pr" data-id="${t.id}" title="Приоритет: ${{hi:'высокий',mid:'средний',low:'низкий'}[t.pr]}"></button>${t.st!=='done'?`<button class="tstat ${t.st}" data-act="task-st" data-id="${t.id}">${t.st==='doing'?'в работе':'к работе'}</button>`:''}<button class="btn small ghost" data-act="task-prompt" data-id="${t.id}">${lp?'Открыть промпт':'Собрать промпт'}</button><button class="icon" data-act="task-del" data-id="${t.id}" title="Удалить">✕</button></div></div>`;}).join(''):`<div class="emptybox"><p>${S.taskF==='done'?'Готовых задач пока нет.':'Задач нет. Запиши первую — Enter добавляет.'}</p></div>`}`;

/* ================= DASH ================= */

 const cnt=k=>S.dash.filter(d=>d.type===k).length;
 return `<h1 class="h1">DASH</h1><p class="lead">Журнал промптинга: правила, уроки запусков, гипотезы. Закреплённые правила автоматически добавляются в каждый промпт.</p>

 <div class="panel mt16">${seg('dtype','',DTYPES.filter(d=>d[0]!=='log').map(d=>[d[0],d[1]]),S.dashType)}<p class="hint mt6">${esc((DTYPES.find(d=>d[0]===S.dashType)||[])[2]||'')}</p><textarea id="dashNew" rows="2" placeholder="Запись — Ctrl+Enter"></textarea><div class="row mt8 between"><label class="switch" style="margin:0"><input type="checkbox" data-act="setb" data-sk="logRuns" ${S.set.logRuns?'checked':''}><span>Записывать каждое копирование как запуск</span></label><button class="btn primary small" data-act="dash-add">Записать</button></div></div>
 <div class="row mt16">${[['all','Все',S.dash.length]].concat(DTYPES.map(d=>[d[0],d[1],cnt(d[0])])).map(f=>`<button class="chip ${S.dashF===f[0]?'on':'off'}" data-act="dash-f" data-v="${f[0]}" ${f[0]!=='all'?`data-type="${f[0]}"`:''}>${f[1]} ${f[2]}</button>`).join('')}</div>

let liveRaf=0;
function live(){

 liveRaf=requestAnimationFrame(()=>{
  const p=cur();if(!p)return;

 try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(t);return true;}}catch(e){}
 try{const ta=document.createElement('textarea');ta.value=t;ta.setAttribute('readonly','');ta.style.cssText='position:fixed;top:0;left:0;opacity:0';document.body.appendChild(ta);ta.select();const ok=document.execCommand('copy');ta.remove();if(ok)return true;}catch(e){}
 return false;
}

async function aiRun(){
 const p=cur();if(!p||!S.ai||S.aiBusy)return;
 const B=p.b||{};
 if(!Object.values(B).some(v=>String(v||'').trim())){toast('Сначала заполни хотя бы задачу');return;}
 const send={};BLOCKS.forEach(b=>{if(b.k!=='materials'&&(B[b.k]||'').trim())send[b.k]=B[b.k];});
 const mat=(B.materials||'').trim();
 const props=PROPS.map(pr=>pr.n+': '+((pr.o.find(o=>o[0]===p.p[pr.k])||[])[1]||'')).join('; ');
 const q=`Ты — инженер промптов для Claude. Ниже черновик промпта пользователя, разложенный по блокам, и свойства запроса. Улучши черновик.

Правила:
- Сохрани смысл, факты и цифры пользователя. Ничего не выдумывай о его ситуации: где данных не хватает, оставь поле в квадратных скобках, например [сколько учеников сейчас].
- Задача — одно главное действие глаголом совершенного вида. Убери оценочные слова без меры («хорошо», «качественно»), местоимения без опоры, формулировки «больше» и «максимально».
- Добавь критерий успеха и формат ответа, если их нет.
- Пиши на языке черновика, живым языком, без канцелярита.
- Блок materials не переписывай и не возвращай.

Свойства запроса: ${props}
Включённые методы: ${(p.t||[]).map(id=>TK[id]?TK[id].n:'').join(', ')||'нет'}
${mat?`Материалы (только для понимания, ${mat.length} знаков): ${mat.slice(0,1500)}${mat.length>1500?' …':''}\n`:''}Блоки черновика (JSON): ${JSON.stringify(send)}

Ответь только JSON без markdown, по схеме:
{"weak":["главная слабость черновика", "... до 5"],"blocks":{"role":"","context":"","task":"","constraints":"","nongoals":"","examples":"","format":"","criteria":"","extra":""},"techniques":["id метода"],"questions":["вопрос пользователю, ответ на который сильнее всего улучшит промпт", "... до 4"]}
Пустые блоки, которые не нужны, оставь пустыми. Доступные id методов: ${TECH.map(t=>t.id+' ('+t.n+')').join(', ')}.`;
 S.aiBusy=true;S.aiErr='';S.aiCtl=new AbortController();rAi();rRail();
 try{
  const r=await S.ai.json(q,{signal:S.aiCtl.signal,modelTier:'default'});
  if(!r||typeof r!=='object')throw {message:'Пустой ответ'};
  S.aiRes={weak:Array.isArray(r.weak)?r.weak.map(String).slice(0,6):[],blocks:r.blocks&&typeof r.blocks==='object'?r.blocks:{},techniques:Array.isArray(r.techniques)?r.techniques.map(String):[],questions:Array.isArray(r.questions)?r.questions.map(String).slice(0,5):[]};
  S.aiQA=[];
 }catch(e){
  const c=e&&e.code;
  S.aiErr=c==='cancelled'?'Остановлено.':c==='not_granted'?'Нет разрешения на запросы к Claude из этой страницы.':c==='rate_limited'?'Слишком часто — подожди минуту и попробуй снова.':'Не получилось: '+((e&&e.message)||'ошибка')+'. Попробуй ещё раз.';
  if(c==='not_granted')S.ai=null;
 }
 S.aiBusy=false;S.aiCtl=null;rAi();rRail();
}
function aiTake(k){const p=cur(),r=S.aiRes;if(!p||!r||!r.blocks[k])return;snapshot(p,'до правки Claude: '+BK[k].n);p.b[k]=String(r.blocks[k]);p.raw=null;Store.touchP(p);rWork();rRail();rNav();toast('Блок «'+BK[k].n+'» обновлён');}
function aiApply(){
 const p=cur(),r=S.aiRes;if(!p||!r)return;snapshot(p,'до улучшения Claude');
 Object.keys(r.blocks||{}).forEach(k=>{if(BK[k]&&k!=='materials'){const v=String(r.blocks[k]||'').trim();if(v)p.b[k]=v;}});
 (r.techniques||[]).forEach(id=>{if(TK[id])setTech(p,id,true);});
 p.raw=null;Store.touchP(p);rWork();rRail();rNav();toast('Улучшения применены — прежняя версия в истории');
}
function aiQA(){
 const p=cur(),r=S.aiRes;if(!p||!r)return;
 const lines=(r.questions||[]).map((q,i)=>[q,(S.aiQA[i]||'').trim()]).filter(x=>x[1]);
 if(!lines.length){toast('Ответь хотя бы на один вопрос');return;}
 p.b.context=((p.b.context||'').trim()+'\n\nУточнения:\n'+lines.map(x=>'— '+x[0]+' '+x[1]).join('\n')).trim();
 S.aiQA=[];Store.touchP(p);rWork();rRail();toast('Ответы добавлены в контекст');
}

function doImport(file){
 const fr=new FileReader();
 fr.onload=()=>{let d;try{d=JSON.parse(fr.result);}catch(e){toast('Это не JSON-файл Промпт-лаба');return;}
  if(!d||!Array.isArray(d.prompts)){toast('В файле нет промптов');return;}
  const byId={};S.prompts.forEach(p=>byId[p.id]=p);let n=0;
  d.prompts.forEach(p=>{if(!p||!p.id)return;const l=byId[p.id];if(!l||(p.u||0)>(l.u||0)){const np=norm(p);if(l)S.prompts[S.prompts.indexOf(l)]=np;else S.prompts.push(np);Store.dirty.add(np.id);n++;}});
  const mergeArr=(a,b)=>{const ids=new Set(a.map(x=>x.id));(b||[]).forEach(x=>{if(x&&x.id&&!ids.has(x.id))a.push(x);});};
  mergeArr(S.tasks,d.tasks);mergeArr(S.dash,d.dash);mergeArr(S.tpls,d.tpls);
  Store.touchM();Store.sched(200);ensureCur();fullRender();toast('Загружено промптов: '+n);
 };
 fr.readAsText(file);
}

 'task-del':a=>{S.tasks=S.tasks.filter(x=>x.id!==a.dataset.id);Store.touchM();rWork();rNav();},
 'task-prompt':a=>{const t=S.tasks.find(x=>x.id===a.dataset.id);if(!t)return;let p=t.pid&&S.prompts.find(x=>x.id===t.pid);
  if(!p){p=newPrompt({title:t.text.slice(0,80)});p.b.task=t.text;S.prompts.push(p);t.pid=p.id;if(t.st==='todo')t.st='doing';Store.touchP(p);Store.touchM();}
  openP(p.id);},
 dtype:a=>{S.dashType=a.dataset.v;const keep=($('dashNew')||{}).value||'';rWork();const d=$('dashNew');if(d){d.value=keep;d.focus();}},
 'dash-add':()=>{const i=$('dashNew');const v=(i&&i.value||'').trim();if(!v)return;S.dash.unshift({id:uid(),type:S.dashType,text:v,c:now(),pin:false});Store.touchM();rWork();rNav();},
 'dash-f':a=>{S.dashF=a.dataset.v;rWork();},
 'dash-pin':a=>{const d=S.dash.find(x=>x.id===a.dataset.id);if(!d)return;d.pin=!d.pin;Store.touchM();rWork();toast(d.pin?'Правило будет в каждом промпте':'Правило убрано из промптов');},
 'dash-torule':a=>{const d=S.dash.find(x=>x.id===a.dataset.id);if(!d)return;d.type='rule';d.c=now();Store.touchM();rWork();toast('Гипотеза стала правилом');},
 'dash-edit':a=>{S.dEdit=S.dEdit===a.dataset.id?null:a.dataset.id;rWork();const t=document.querySelector(`[data-dk="${a.dataset.id}"]`);if(t)t.focus();},
 'dash-del':a=>{S.dash=S.dash.filter(x=>x.id!==a.dataset.id);Store.touchM();rWork();rNav();},
 export:()=>doExport(),
 import:()=>$('importFile').click(),
 'm-btn':a=>{const b=S.mb[+a.dataset.i];closeModal();if(b&&b.fn)b.fn();}
};
document.addEventListener('click',e=>{
 if(e.target===$('modal')){closeModal();return;}
 const a=e.target.closest('[data-act]');if(!a)return;
 const fn=ACT[a.dataset.act];if(!fn)return;
 if(a.tagName==='INPUT'&&a.type==='checkbox'){fn(a,e);return;}
 e.preventDefault();fn(a,e);
});
document.addEventListener('input',e=>{
 const el=e.target;
 if(el.tagName==='TEXTAREA')grow(el);
 if(el.id==='tplQ'){S.tplQ=el.value;$('tplList').innerHTML=tplListHTML();return;}
 if(el.id==='fbNote'){S.fbNote=el.value;return;}
 if(el.dataset.qa!=null){S.aiQA[+el.dataset.qa]=el.value;return;}
 if(el.dataset.tk){const t=S.tasks.find(x=>x.id===el.dataset.tk);if(t){t.text=el.value;Store.touchM();}return;}
 if(el.dataset.dk){const d=S.dash.find(x=>x.id===el.dataset.dk);if(d){d.text=el.value;Store.touchM();}return;}
 const k=el.dataset.k;if(!k)return;
 const p=cur();if(!p)return;
 if(k.startsWith('b.')){p.b=p.b||{};p.b[k.slice(2)]=el.value;}
 else if(k.startsWith('tv.')){p.tv=p.tv||{};p.tv[k.slice(3)]=el.value;}
 else if(k.startsWith('p.')){p.p[k.slice(2)]=el.value;Store.touchP(p);rProps();rTech();live();return;}
 else if(k==='title'){p.title=el.value;}
 else if(k==='raw'){p.raw=el.value;}
 else if(k==='stage'||k==='rev'){p[k]=el.value;Store.touchP(p);rNav();return;}
 else return;
 Store.touchP(p);live();
});
document.addEventListener('toggle',e=>{const t=e.target;if(!t||!t.classList)return;if(t.classList.contains('sets'))S.setOpen=t.open;else if(t.classList.contains('tgroup')&&t.dataset.g)S.tgOpen[t.dataset.g]=t.open;},true);
document.addEventListener('change',e=>{
 const el=e.target;
 if(el.id==='importFile'&&el.files&&el.files[0]){doImport(el.files[0]);el.value='';return;}
 if(el.dataset.k==='stage'||el.dataset.k==='rev'){const p=cur();if(p){p[el.dataset.k]=el.value;Store.touchP(p);rNav();}}
});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'&&!$('modal').hidden){closeModal();return;}
 const mod=e.ctrlKey||e.metaKey;
 if(mod&&e.key==='Enter'){
  if(e.target.id==='dashNew'){e.preventDefault();ACT['dash-add']();return;}
  if(S.view==='build'){e.preventDefault();doCopy();}
  return;
 }
 if(mod&&(e.key==='s'||e.key==='ы')&&S.view==='build'){e.preventDefault();ACT.savever();return;}
 if(e.key==='Enter'&&!e.shiftKey){
  const id=e.target.id;
  if(id==='taskNew'){e.preventDefault();ACT['task-add']();}
  else if(id==='ideaNew'){e.preventDefault();ACT['idea-add']();}
  else if(id==='noteNew'){e.preventDefault();ACT['note-add']();}
  else if(id==='tplName'){e.preventDefault();const b=document.querySelector('#mbox .btn.primary');if(b)b.click();}
 }
});

/* ================= СТАРТ ================= */
(function init(){
 const d=Store.loadLocal();
 if(d&&Array.isArray(d.prompts)){S.prompts=d.prompts.filter(p=>p&&p.id).map(norm);S.tasks=d.tasks||[];S.dash=d.dash||[];S.tpls=d.tpls||[];S.set=Object.assign(S.set,d.set||{});S.mu=d.mu||0;}
 else{
  const p=newPrompt({seed:true});S.prompts=[p];
  S.dash=[
   {id:uid(),type:'rule',text:'Новый чат под новую задачу. Переношу бриф, а не историю.',c:now(),pin:false},
   {id:uid(),type:'rule',text:'Не знаю, чего хочу, — значит режим прояснения: сначала интервью, потом исполнение.',c:now(),pin:false},
   {id:uid(),type:'hyp',text:'Промпты с критерием успеха требуют меньше кругов правок.',c:now()}
  ];S.mu=0;
 }
 try{const u=JSON.parse(localStorage.getItem(LSU)||'null');if(u){if(u.view)S.view=u.view;if(u.cur){S.cur=u.cur;S.wantCur=u.cur;}}}catch(e){}
 if(!['build','tpl','methods','ripen','tasks','dash'].includes(S.view))S.view='build';
 ensureCur();applyTheme();fullRender();
 Store.connect();
 if(window.claude&&typeof window.claude.use==='function'){
  window.claude.use('sample').then(s=>{S.ai=s||null;if(S.ai&&S.view==='build'){rWork();rRail();}}).catch(()=>{});
  window.claude.use('downloads').then(x=>{S.dl=x||null;}).catch(()=>{});
 }
})();
})();
</script>
