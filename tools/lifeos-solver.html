<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Life OS — Решатель задач</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Unbounded:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF0F5;--bg2:#FFFFFF;--bg3:#F5F7FB;--line:#D6DCE7;--line2:#C2CAD9;
  --ink:#1B2232;--ink2:#48536B;--ink3:#76819A;
  --hill:#B27A10;--hill-soft:rgba(178,122,16,.12);--on-hill:#FFFFFF;
  --t-result:#2F6DB8;--t-decision:#7547C2;--t-question:#B8436A;--t-action:#1F845A;
  --hi:#C4452C;--mid:#A06C0C;--low:#2F6DB8;
  --shadow:0 20px 50px rgba(27,34,50,.20);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1B2232;--bg2:#222B3E;--bg3:#2A3449;--line:#364259;--line2:#46536E;
    --ink:#E8EBF1;--ink2:#AAB3C6;--ink3:#7B879F;
    --hill:#E9B44C;--hill-soft:rgba(233,180,76,.13);--on-hill:#1B2232;
    --t-result:#89B8F2;--t-decision:#C3A0F2;--t-question:#EF93AC;--t-action:#7DD3A9;
    --hi:#F27B62;--mid:#E9B44C;--low:#89B8F2;
    --shadow:0 20px 50px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1B2232;--bg2:#222B3E;--bg3:#2A3449;--line:#364259;--line2:#46536E;
  --ink:#E8EBF1;--ink2:#AAB3C6;--ink3:#7B879F;
  --hill:#E9B44C;--hill-soft:rgba(233,180,76,.13);--on-hill:#1B2232;
  --t-result:#89B8F2;--t-decision:#C3A0F2;--t-question:#EF93AC;--t-action:#7DD3A9;
  --hi:#F27B62;--mid:#E9B44C;--low:#89B8F2;
  --shadow:0 20px 50px rgba(0,0,0,.5);
  color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.55 "Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.display{font-family:"Unbounded","Golos Text",system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
svg{max-width:100%}
[data-type="result"]{--tc:var(--t-result)}[data-type="decision"]{--tc:var(--t-decision)}
[data-type="question"]{--tc:var(--t-question)}[data-type="action"]{--tc:var(--t-action)}

.app{display:grid;grid-template-columns:252px minmax(0,1fr) 322px;max-width:1720px;margin:0 auto}
.nav,.rail{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;max-height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow:auto}
.nav{padding:24px 14px 24px 18px;border-right:1px solid var(--line)}
.rail{padding:24px 20px 24px 18px;border-left:1px solid var(--line)}
.work{padding:26px 34px 90px;min-width:0}
@media (max-width:1180px){
  .app{grid-template-columns:232px minmax(0,1fr)}
  .rail{position:static;grid-column:2;max-height:none;border-left:0;border-top:1px solid var(--line);padding:24px 34px 60px}
}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr)}
  .nav{position:static;max-height:none;border-right:0;border-bottom:1px solid var(--line);padding:16px}
  .work{padding:20px 16px 36px}
  .rail{grid-column:1;padding:22px 16px 48px}
}

/* nav */
.brand{font:600 18px/1.2 "Unbounded",system-ui,sans-serif;margin:0 10px 2px}
.module{margin:0 10px 18px;color:var(--ink3);font-size:13px}
.navlink,.titem{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:7px 10px;cursor:pointer;color:var(--ink2)}
.navlink:hover,.titem:hover{background:var(--bg3);color:var(--ink)}
.navlink[aria-current="true"],.titem[aria-current="true"]{background:var(--bg3);color:var(--ink);box-shadow:inset 2px 0 0 var(--hill)}
.navlink .cnt{margin-left:auto;font-size:12.5px;color:var(--ink3)}
.tname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sbadge{flex:none;width:21px;height:21px;border-radius:6px;display:inline-grid;place-items:center;border:1px solid var(--line2);font:600 10px/1 "Unbounded",sans-serif;color:var(--ink2)}
.gdot{flex:none;width:7px;height:7px;border-radius:50%;background:var(--mid)}.gdot.hi{background:var(--hi)}
.live{flex:none;width:8px;height:8px;border-radius:50%;background:var(--hill);box-shadow:0 0 0 3px var(--hill-soft)}
.ghead{margin:18px 10px 5px;font-size:12.5px;color:var(--ink3)}
.newbtn{margin:0 0 10px}
details.tasks>summary{list-style:none;cursor:pointer}
details.tasks>summary::-webkit-details-marker{display:none}
details.more>summary{cursor:pointer;margin:14px 10px 4px;font-size:12.5px;color:var(--ink3)}
.store{margin:22px 10px 0;font-size:12.5px;color:var(--ink3);line-height:1.45}
.store .row{margin-top:8px}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line2);background:var(--bg3);border-radius:9px;padding:8px 14px;cursor:pointer;font-weight:500;font-size:14px;line-height:1.3}
.btn:hover{border-color:var(--ink3)}
.btn.primary{background:var(--hill);border-color:var(--hill);color:var(--on-hill)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink2)}
.btn.ghost:hover{background:var(--bg3)}
.btn.small{padding:5px 10px;font-size:13px}
.btn.full{width:100%}
.btn:disabled{opacity:.5;cursor:default}
.link{background:none;border:0;padding:0;color:var(--hill);cursor:pointer;text-decoration:underline;text-underline-offset:2px;font-size:inherit}
.icon{width:30px;height:30px;flex:none;border-radius:7px;border:1px solid var(--line);background:var(--bg3);cursor:pointer;display:grid;place-items:center;color:var(--ink2);font-size:15px;line-height:1}
.icon:hover{color:var(--ink);border-color:var(--line2)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row.end{justify-content:flex-end}
.mt6{margin-top:6px}.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}
.muted{color:var(--ink3)}.small{font-size:13px}
.seg{display:inline-flex;flex-wrap:wrap;background:var(--bg3);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:5px 11px;border-radius:7px;cursor:pointer;color:var(--ink2);font-size:13.5px}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--bg2);color:var(--ink);box-shadow:0 0 0 1px var(--line2)}
input[type=text],input[type=number],input[type=date],textarea,select{width:100%;background:var(--bg3);border:1px solid var(--line);border-radius:8px;padding:8px 11px;line-height:1.45}
textarea{resize:vertical;min-height:42px;overflow:hidden;display:block}
select{cursor:pointer}
input[type=range]{width:100%;accent-color:var(--hill)}
input[type=checkbox],input[type=radio]{accent-color:var(--hill);width:16px;height:16px;margin:3px 0 0;flex:none}
:focus-visible,input:focus,textarea:focus,select:focus{outline:2px solid var(--hill);outline-offset:1px}
input::placeholder,textarea::placeholder{color:var(--ink3)}

/* task head */
.thead{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:flex-start;justify-content:space-between}
.tmain{flex:1 1 360px;min-width:0}
.ttitle{font:500 24px/1.3 "Unbounded",system-ui,sans-serif;background:transparent;border:0;border-bottom:1px dashed transparent;border-radius:0;padding:2px 0;width:100%}
.ttitle:focus{outline:none;border-bottom-color:var(--line2)}
.tmeta{color:var(--ink3);font-size:13.5px;margin-top:4px}
.tctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.banner,.savept{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;margin:16px 0 0;padding:11px 14px;border-radius:10px;background:var(--bg2);border:1px solid var(--line)}
.savept{display:block;border-left:3px solid var(--hill)}
.savept p{margin:3px 0 0}

/* hill */
.hillwrap{margin:14px 0 4px}
.hill{display:block;width:100%;height:auto;overflow:visible}
.hill .area{fill:var(--hill);opacity:.07}
.hill .base{stroke:var(--line);stroke-width:1}
.hill .curve{fill:none;stroke:var(--hill);stroke-width:2.5;stroke-linecap:round}
.hill .st circle{fill:var(--bg);stroke:var(--line2);stroke-width:2}
.hill .st.cur circle{stroke:var(--hill);stroke-width:2.5}
.hill .st text{fill:var(--ink3);font:500 14px "Golos Text",sans-serif;text-anchor:middle}
.hill .st.sel text{fill:var(--ink)}
.hill [data-act]{cursor:pointer}
.hill .st:focus{outline:none}.hill .st:focus-visible circle{stroke:var(--ink);stroke-width:3}
.hill .slope{fill:var(--ink3);font:400 13.5px "Golos Text",sans-serif}
.hill .peak{fill:var(--ink2);font:500 13px "Golos Text",sans-serif}
.hill .dotg{transition:transform .9s cubic-bezier(.3,.75,.2,1)}
.hill .halo{fill:var(--hill);opacity:.2}
.hill .dot{fill:var(--hill)}
.hill .dot.warn{stroke:var(--hi);stroke-width:3.5}
.hill .dlabel{fill:var(--ink);font:500 14px "Golos Text",sans-serif;paint-order:stroke;stroke:var(--bg);stroke-width:4px}
@media (max-width:760px){.hill .st text,.hill .slope,.hill .peak{display:none}}

/* tabs */
.tabs{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;margin:4px 0 26px}
.tab{display:block;border:1px solid var(--line);background:var(--bg2);border-radius:10px;padding:7px 10px 9px;text-align:left;cursor:pointer;min-width:0}
.tab:hover{border-color:var(--line2)}
.tab .n{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink3)}
.tab .nm{display:block;font-weight:500;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tab .bar{display:block;height:3px;background:var(--line);border-radius:2px;margin-top:7px;overflow:hidden}
.tab .bar i{display:block;height:100%;background:var(--hill);transition:width .4s}
.tab[aria-selected="true"]{border-color:var(--hill);box-shadow:inset 0 0 0 1px var(--hill)}
.here-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--hill)}
@media (max-width:760px){.tabs{grid-template-columns:repeat(3,minmax(0,1fr))}}

/* phase */
.phead h2{font:500 20px/1.3 "Unbounded",system-ui,sans-serif;margin:0 0 5px}
.phead p{margin:0;color:var(--ink2);max-width:64ch}
.block{margin-top:30px}
.bhead{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline}
.block h3{font:600 15.5px/1.35 "Golos Text",sans-serif;margin:0 0 4px}
.block>.hint{max-width:72ch}
.counter{font-size:13px;color:var(--mid)}.counter.ok{color:var(--t-action)}
.goal{margin:8px 0 12px;padding:8px 12px;border-radius:8px;background:var(--hill-soft);font-size:14px}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 22px;margin-top:14px}
.field{min-width:0}
.field.wide{grid-column:1/-1}
.field label,.flabel,.lbl{display:block;font-weight:500;font-size:14.5px;margin-bottom:3px}
.lbl{margin-top:12px}
.hint{margin:0 0 7px;color:var(--ink3);font-size:13px;line-height:1.45}
.check{margin:6px 0 0;font-size:13px;color:var(--mid)}
.check[hidden]{display:none}
.checkline{display:flex;gap:10px;align-items:flex-start;margin-top:14px;cursor:pointer}
@media (max-width:760px){.form{grid-template-columns:minmax(0,1fr)}}
.pfoot{margin-top:38px;padding-top:18px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:14px;justify-content:space-between;align-items:flex-start}
.methods{flex:1 1 360px;max-width:72ch}
.methods summary{cursor:pointer;color:var(--ink2);font-size:14px}
.methods ul{margin:10px 0 0;padding-left:18px;color:var(--ink2);font-size:13.5px}
.methods li{margin-bottom:6px}
.emptybox{padding:16px;border:1px dashed var(--line2);border-radius:12px;margin-top:22px;color:var(--ink2)}
.emptybox p{margin:0 0 10px}

/* tree */
.legend{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 18px;margin:10px 0 14px;font-size:13px;color:var(--ink3)}
.legend div{display:flex;gap:8px;align-items:baseline}
.chip{display:inline-flex;align-items:center;flex:none;font-size:12.5px;font-weight:500;padding:2px 9px;border-radius:999px;border:1px solid color-mix(in srgb,var(--tc,var(--line2)) 55%,transparent);background:color-mix(in srgb,var(--tc,var(--line2)) 13%,transparent);color:var(--ink)}
.tree-head,.node{display:grid;grid-template-columns:128px minmax(0,1fr) 104px 104px auto;gap:8px;align-items:center}
.tree-head{font-size:12.5px;color:var(--ink3);padding:0 8px 6px 11px}
.node{background:var(--bg2);border:1px solid var(--line);border-left:3px solid var(--tc,var(--line2));border-radius:9px;padding:6px 6px 6px 8px;margin:0 0 6px calc(var(--depth,0)*24px)}
.node select,.node input{padding:6px 8px;font-size:14px}
.node .typesel{color:var(--tc,var(--ink2));font-weight:500}
.nacts{display:flex;gap:4px}
@media (max-width:760px){
  .tree-head{display:none}
  .node{grid-template-columns:minmax(0,1fr) minmax(0,1fr);margin-left:calc(var(--depth,0)*12px)}
  .node .ntitle{grid-column:1/-1;order:-1}
  .nacts{grid-column:1/-1;justify-content:flex-end}
}
.sugs{margin-top:14px;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--bg2)}
.sug{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 10px;align-items:start;padding:8px 0;border-bottom:1px solid var(--line)}
.sug:last-of-type{border-bottom:0}
.sug small{grid-column:2;color:var(--ink3);font-size:13px}
.lenses{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}
.lens{display:flex;gap:10px;align-items:flex-start;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--bg2);cursor:pointer}
.lens b{display:block;font-weight:500;font-size:14px}
.lens small{display:block;color:var(--ink3);font-size:12.5px;line-height:1.4}
.lens:has(input:checked){border-color:color-mix(in srgb,var(--hill) 60%,transparent)}
@media (max-width:760px){.lenses,.legend{grid-template-columns:minmax(0,1fr)}}

/* matrix */
.matrix{display:grid;grid-template-columns:26px minmax(0,1fr) minmax(0,1fr);grid-template-rows:auto auto auto;gap:6px;margin-top:12px}
.axis-y{writing-mode:vertical-rl;transform:rotate(180deg);font-size:12px;color:var(--ink3);text-align:center;align-self:center}
.axis-x{font-size:12px;color:var(--ink3);text-align:center}
.mcell{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px 11px;min-height:96px}
.mcell.hot{border-color:var(--hill);background:var(--hill-soft)}
.mcell h4{margin:0;font-size:13.5px;font-weight:600}
.mcell p{margin:2px 0 8px;font-size:12.5px;color:var(--ink3)}
.mcell .chip{margin:0 4px 4px 0;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* cards */
.card{background:var(--bg2);border:1px solid var(--line);border-left:3px solid var(--tc,var(--line2));border-radius:12px;padding:14px 16px 16px;margin-top:12px}
.chead{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center}
.chead h4{margin:0;font-size:15.5px;font-weight:600;flex:1;min-width:180px}
.lv{font-size:12.5px;color:var(--ink3)}
.conf{position:relative;padding-top:4px}
.conf .thr{position:absolute;top:0;width:2px;height:24px;background:var(--hi);transform:translateX(-1px);pointer-events:none;border-radius:1px}
.probe{border-top:1px dashed var(--line2);padding-top:12px}
.gate{list-style:none;padding:0;margin:12px 0 0}
.gate li{display:flex;gap:10px;padding:6px 0;color:var(--ink2);font-size:14px}
.gate li.ok{color:var(--ink)}
.gate .gi{flex:none;width:18px;text-align:center;color:var(--ink3)}
.gate li.ok .gi{color:var(--t-action)}
.gmsg{margin:8px 0 0;font-size:13.5px;color:var(--ink2)}.gmsg.ok{color:var(--t-action)}.gmsg.bad{color:var(--hi)}

/* board */
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}
.col{background:var(--bg3);border:1px solid var(--line);border-radius:12px;padding:10px;min-height:110px}
.col h4{margin:0 0 8px;font-size:13.5px;font-weight:600;display:flex;justify-content:space-between}
.aitem{background:var(--bg2);border:1px solid var(--line);border-left:3px solid var(--t-action);border-radius:9px;padding:8px 10px;margin-bottom:7px;font-size:14px}
.aitem.blocked{border-left-color:var(--line2);opacity:.8}
.aitem select{margin-top:6px;padding:4px 8px;font-size:12.5px}
.aitem .row{margin-top:6px}
@media (max-width:760px){.board{grid-template-columns:minmax(0,1fr)}}
.tbl{overflow-x:auto;margin-top:10px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:500;color:var(--ink3)}
td.num{white-space:nowrap;font-variant-numeric:tabular-nums}

/* step card, overview, lists */
.stepcard{margin-top:22px;max-width:760px}
.lead{color:var(--ink2);max-width:64ch;margin:0}
.ohead h1,.empty h1{font:500 26px/1.25 "Unbounded",system-ui,sans-serif;margin:0 0 8px}
.ohead p,.empty p{color:var(--ink2);max-width:64ch;margin:0 0 10px}
.empty{max-width:720px;margin:6vh 0 0}
.list{margin-top:10px;border-top:1px solid var(--line)}
.li{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) auto;gap:6px 16px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line)}
.li .nm{font-weight:500;background:none;border:0;padding:0;text-align:left;cursor:pointer;color:var(--ink)}
.li .nm:hover{color:var(--hill)}
.li .sub{font-size:13px;color:var(--ink3)}
.li.over .sub{color:var(--hi)}
@media (max-width:760px){.li{grid-template-columns:minmax(0,1fr) auto}.li .mid{grid-column:1/-1;order:3}}
.qlist{margin:10px 0 0;padding-left:20px;color:var(--ink2)}
.qlist li{margin-bottom:5px}
.pitem{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 14px;padding:11px 4px;border-bottom:1px solid var(--line)}
.pitem p{margin:0}
.pitem .sub{font-size:13px;color:var(--ink3)}
.addrow{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) auto;gap:8px;margin-top:12px}
@media (max-width:760px){.addrow{grid-template-columns:minmax(0,1fr)}}

/* rail */
.rsec{margin-bottom:28px}
.rsec h3{display:flex;align-items:center;gap:8px;font:600 14.5px/1.3 "Golos Text",sans-serif;margin:0 0 10px}
.count{font-size:12px;font-weight:600;padding:1px 7px;border-radius:999px;background:var(--bg3);border:1px solid var(--line);color:var(--ink2)}
.timer{font:500 34px/1 "Unbounded",system-ui,sans-serif;font-variant-numeric:tabular-nums;margin-top:4px}
.pbar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:10px 0 12px}
.pbar i{display:block;height:100%;background:var(--hill)}
.sess.over .timer{color:var(--hi)}.sess.over .pbar i{background:var(--hi)}
.sq{margin:0 0 12px;padding:8px 10px;border-radius:8px;background:var(--bg2);border:1px solid var(--line);font-size:14px}
.nudge{border:1px solid var(--hill);background:var(--hill-soft);border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:13.5px}
.nudge .row{margin-top:8px}
.endf{border-top:1px solid var(--line);margin-top:6px;padding-top:4px}
.guard{display:block;width:100%;text-align:left;border:0;border-left:3px solid var(--gc);background:var(--bg2);padding:8px 11px;border-radius:0 9px 9px 0;margin-bottom:7px;cursor:pointer;color:var(--ink)}
.guard:hover{background:var(--bg3)}
.guard b{display:block;font-size:12.5px;font-weight:600;color:var(--gc)}

 s+=`<path class="area" d="${HILL_D} Z"/><line class="base" x1="40" x2="960" y1="168" y2="168"/><path class="curve" d="${HILL_D}"/>`;
 s+=`<text class="slope" x="${HX(.2)}" y="${HY(.2)-40}" text-anchor="middle">Выясняю</text><text class="slope" x="${HX(.8)}" y="${HY(.8)-40}" text-anchor="middle">Делаю</text>`;
 if(one)s+=`<text class="peak" x="500" y="22" text-anchor="middle">Вершина: неизвестное снято</text>`;
 PHASES.forEach((ph,i)=>{
  const x=HX(ph.t),y=HY(ph.t);
  s+=`<g class="st${one&&one.phase===i?' cur':''}${one&&S.viewPhase===i?' sel':''}"${one?` data-act="phase" data-p="${i}" tabindex="0" role="button" aria-label="Открыть фазу ${ph.name}"`:''}><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="7"/><text x="${x.toFixed(1)}" y="198">${ph.name}</text></g>`;
 });
 list.forEach((t,i)=>{
  const [x,y]=dotXY(t),warn=taskGuards(t).some(g=>g.sev==='hi');
  s+=`<g class="dotg" style="transform:translate(${x.toFixed(1)}px,${y.toFixed(1)}px)"${one?'':` data-act="open-task" data-id="${t.id}"`}><circle class="halo" r="17"/><circle class="dot${warn?' warn':''}" r="8"/>${one?'':`<text class="dlabel" x="0" y="${-26-(i%3)*18}" text-anchor="middle">${esc(short(t.title,24))}</text>`}</g>`;
 });
 return s+'</svg>';
}
function moveDot(t){const g=$('#hill .dotg');if(g){const [x,y]=dotXY(t);g.style.transform=`translate(${x.toFixed(1)}px,${y.toFixed(1)}px)`;}}

/* ---------- render infrastructure ---------- */
const R={};
function grow(el){el.style.height='auto';el.style.height=(el.scrollHeight+2)+'px';}
function paint(id,html){
 const el=document.getElementById(id);if(!el)return;
 const a=document.activeElement;let key=null,s0=null,s1=null;
 if(a&&el.contains(a)&&a.dataset&&a.dataset.key){key=a.dataset.key;try{s0=a.selectionStart;s1=a.selectionEnd;}catch(e){}}
 el.innerHTML=html;
 el.querySelectorAll('textarea').forEach(grow);
 if(key){const n=el.querySelector('[data-key="'+cssEsc(key)+'"]');if(n){n.focus({preventScroll:true});try{if(s0!=null)n.setSelectionRange(s0,s1);}catch(e){}}}
}
function region(r){const el=document.getElementById(r);if(!el||!R[r])return;if(el.contains(document.activeElement)&&document.activeElement!==el){S.stale.add(r);}else{S.stale.delete(r);R[r]();}}
function fullRender(soft){['nav','work','rail'].forEach(r=>soft?region(r):R[r]());}
let softRaf=0;
function soft(){if(softRaf)return;softRaf=requestAnimationFrame(()=>{softRaf=0;region('nav');region('rail');if(S.view==='map')region('work');updateLive();});}
const LIVE={
 tabs:t=>tabsHTML(t),
 gate:t=>gateHTML(t),
 lvl1:t=>lvl1Text(t),
 budget:t=>budgetText(t),
 conf:(t,id)=>{const n=nodeOf(t,id);return n?confText(t,n):'';},
 qchk:(t,id)=>{const n=nodeOf(t,id);return n?qchkHTML(n):'';}
};
function updateLive(){
 const t=cur();if(!t||S.view!=='task')return;
 document.querySelectorAll('#work [data-live]').forEach(el=>{const f=LIVE[el.dataset.live];if(f&&!el.contains(document.activeElement))el.innerHTML=f(t,el.dataset.arg);});
 moveDot(t);
}
function checkField(el,t){
 const p=el.dataset.bind;if(!CHECKS[p])return;
 const msg=CHECKS[p](getPath(t,p),t),c=document.querySelector('[data-check="'+cssEsc(p)+'"]');
 if(c){c.hidden=!msg;c.textContent=msg||'';}
}
function touch(t){t.updated=Date.now();Store.saveTask(t.id);soft();}
function touchG(){S.global.updated=Date.now();Store.saveGlobal();soft();}
function toast(msg){const d=document.createElement('div');d.className='toast';d.setAttribute('role','status');d.textContent=msg;document.body.appendChild(d);setTimeout(()=>d.remove(),2800);}

/* ---------- field helpers ---------- */
function fieldHTML(t,f){
 if(RANK[t.scale]<RANK[f.min||'S'])return '';
 const v=getPath(t,f.p)??'',id='f_'+f.p.replace(/\./g,'_'),wide=f.wide||f.type==='area';
 if(f.type==='rev')return `<div class="field wide"><div class="flabel">${esc(f.l)}</div>${revHTML(t)}</div>`;
 let inp;
 if(f.type==='area')inp=`<textarea id="${id}" rows="2" data-bind="${f.p}" data-key="${f.p}"${f.ph?` placeholder="${esc(f.ph)}"`:''}>${esc(v)}</textarea>`;
 else inp=`<input id="${id}" type="${f.type==='number'?'number':f.type==='date'?'date':'text'}"${f.type==='number'?' min="0" step="0.5" inputmode="decimal"':''} data-bind="${f.p}" data-key="${f.p}" value="${esc(v)}"${f.ph?` placeholder="${esc(f.ph)}"`:''}>`;
 const chk=CHECKS[f.p]?CHECKS[f.p](v,t):null;
 return `<div class="field${wide?' wide':''}"><div class="lrow"><label for="${id}">${esc(f.l)}</label>${f.h?HT(f.l,f.h):''}</div>${inp}${f.live?`<p class="hint mt6" data-live="${f.live}">${LIVE[f.live](t)}</p>`:''}${CHECKS[f.p]?`<p class="check" data-check="${f.p}"${chk?'':' hidden'}>${esc(chk||'')}</p>`:''}</div>`;
}
function nf(n,f,l,h,type,wide){
 const v=getPath(n,f)??'',id='n_'+n.id+'_'+f.replace(/\./g,'_');
 const inp=type==='area'?`<textarea id="${id}" rows="2" data-node="${n.id}" data-f="${f}" data-key="${n.id}.${f}">${esc(v)}</textarea>`
  :`<input id="${id}" type="${type==='date'?'date':'text'}" data-node="${n.id}" data-f="${f}" data-key="${n.id}.${f}" value="${esc(v)}">`;
 return `<div class="field${wide||type==='area'?' wide':''}"><div class="lrow"><label for="${id}">${esc(l)}</label>${h?HT(l,h):''}</div>${inp}</div>`;
}
function revHTML(t,n){
 const own=n?(n.rev||''):(t.frame.rev||''),eff=n?(n.rev||t.frame.rev||''):own,r=REV[eff];
 const b=Object.entries(REV).map(([k,x])=>`<button type="button" data-act="setrev" data-v="${k}"${n?` data-id="${n.id}"`:''} aria-pressed="${own===k}">${x.name}</button>`).join('');
 return `<div class="seg">${n?`<button type="button" data-act="setrev" data-v="" data-id="${n.id}" aria-pressed="${!own}">Как у задачи</button>`:''}${b}</div>${r?`<p class="hint mt6">Порог уверенности около ${r.thr}%: ${r.do}.</p>`:'<p class="hint mt6">Обратимость задаёт, сколько данных достаточно для решения.</p>'}`;
}
function lvl1Text(t){const n=lvl1(t).length,ok=n>=3&&n<=7;return `<span class="counter${ok?' ok':''}">${n} ${plural(n,'компонент','компонента','компонентов')}${ok?'':', нужно 3–7'}</span>`;}
function budgetText(t){const b=+t.frame.budget,sp=planSpent(t);return `Потрачено на планирование по сессиям: ${fmtMin(sp)}${b>0?` из ${fmtMin(b*60)}`:''}.`;}
function statusText(t){
 if(t.status==='seed')return 'Созревает'+(t.seed.review?', пересмотр '+fmtDate(dateVal(t.seed.review)):'');
 if(t.status==='frozen')return 'Заморожена'+(t.close.until?' до '+fmtDate(dateVal(t.close.until)):'');
 if(t.status==='done')return 'Закрыта как готовая';
 if(t.status==='dropped')return 'Брошена по критерию остановки';
 return t.scale==='S'?'Шаг в работе':'В работе, фаза «'+PHASES[t.phase].name+'»';
}

/* ---------- task workspace ---------- */
function tabsHTML(t){
 return PHASES.map((ph,i)=>`<button class="tab" role="tab" aria-selected="${S.viewPhase===i}" data-act="phase" data-p="${i}"><span class="n">${i+1}${t.phase===i?'<i class="here-dot" title="Задача сейчас здесь"></i>':''}</span><span class="nm">${ph.name}</span><span class="bar"><i style="width:${Math.round(phaseProgress(t,i)*100)}%"></i></span></button>`).join('');
}
function taskHTML(t){
 let h=`<header class="thead"><div class="tmain"><textarea class="ttitle" rows="1" data-bind="title" data-key="title" placeholder="Название задачи" aria-label="Название задачи">${esc(t.title)}</textarea><div class="tmeta">${esc(statusText(t))} ${H('solver')}</div>${placeHTML(t)}</div>
 <div class="tctl"><div class="seg" role="group" aria-label="Масштаб">${['S','M','L'].map(k=>`<button data-act="scale" data-v="${k}" aria-pressed="${t.scale===k}" title="${esc(SCALES[k].hint)}">${SCALES[k].name}</button>`).join('')}</div>${H('scale')}
 <button class="btn ghost small" data-act="export-md">Markdown для ИИ</button><button class="btn ghost small" data-act="del-task">Удалить</button></div></header>${taskBarHTML(t)}`;
 if(['frozen','done','dropped'].includes(t.status)){
  const m={done:'Задача закрыта как готовая.',dropped:'Задача брошена по критерию остановки — это решение, а не провал.',frozen:'Задача заморожена'+(t.close.until?' до '+fmtDate(dateVal(t.close.until)):'')+'.'}[t.status];
  h+=`<div class="banner"><span>${esc(m)}</span><button class="btn small" data-act="reopen">Вернуть в работу</button></div>`;
 }
 if(filled(t.save.where)&&!t.activeSession)h+=`<div class="savept"><b>Продолжить отсюда</b><p>${esc(t.save.where)}</p>${filled(t.save.next)?`<p class="muted">Дальше: ${esc(t.save.next)}</p>`:''}</div>`;
 if(t.scale==='S')return h+stepHTML(t);
 h+=`<div id="hill" class="hillwrap"><span class="hillpen">${H('hill')}</span>${hillSVG([t],t)}</div><nav class="tabs" role="tablist" aria-label="Фазы" data-live="tabs">${tabsHTML(t)}</nav>`;
 const p=S.viewPhase,body=[seedBody,frameBody,mapBody,unknownBody,execBody,closeBody][p](t);
 h+=`<section class="phase"><div class="phead"><h2>${PHASES[p].name} ${H('ph'+p)}</h2><p>${PHASES[p].lead}</p></div>${body}
 <footer class="pfoot"><span></span>
 ${p<5&&t.phase<=p&&t.status!=='done'?`<button class="btn primary" data-act="advance" data-p="${p+1}">${ADV[p]}</button>`:''}</footer></section>`;
 return h;
}
function stepHTML(t){
 const f=F.frame;
 return `<section class="stepcard"><p class="lead">Шаг не ждёт мастер-плана. Мелочи собирай в одно окно на 30–45 минут, глубокую работу ставь длинными блоками.</p><div class="form">
 ${fieldHTML(t,{...f[3],l:'Что будет сделано',h:'Одно предложение-состояние.'})}
 ${fieldHTML(t,{...f[4],wide:1})}
 ${fieldHTML(t,{p:'exec.next',l:'Первое физическое действие',h:'То, что можно начать без раздумий: «открыть анкету и заменить первое фото».',type:'text',min:'S',wide:1})}
 ${fieldHTML(t,{p:'exec.when',l:'Когда и где',type:'text',min:'S'})}
 ${fieldHTML(t,{p:'exec.min',l:'Минут',type:'number',min:'S'})}

 <div class="row mt16">${t.status==='done'?'':`<button class="btn primary" data-act="close-task" data-v="done">Сделано</button>`}<button class="btn" data-act="scale" data-v="M">Это больше, чем шаг</button></div></section>`;
}
function formOf(t,key){return `<div class="form">${F[key].map(f=>fieldHTML(t,f)).join('')}</div>`;}
function seedBody(t){
 return formOf(t,'seed');
}
function frameBody(t){
 return `<div class="form">${F.frame.map(f=>f.p==='frame.budget'?fieldHTML(t,{...f,live:'budget'}):fieldHTML(t,f)).join('')}</div>
 <div class="block"><h3>Ставка и причины ${H('against')}</h3><div class="betbox">${betHTML('t',t)}</div></div>`;
}
function lvSel(n,f,label){
 return `<select data-node="${n.id}" data-f="${f}" data-key="${n.id}.${f}" aria-label="${label}"><option value="">—</option>${Object.entries(f==='unc'?LVF:LV).map(([k,v])=>`<option value="${k}"${n[f]===k?' selected':''}>${v}</option>`).join('')}</select>`;
}
function treeHTML(t,parent,d){
 return kids(t,parent).map(n=>`<div class="node" data-type="${n.type||''}" style="--depth:${d}">
 <select class="typesel" data-node="${n.id}" data-f="type" data-key="${n.id}.type" aria-label="Тип узла"><option value="">Тип?</option>${Object.entries(TYPES).map(([k,x])=>`<option value="${k}"${n.type===k?' selected':''}>${x.name}</option>`).join('')}</select>
 <input class="ntitle" type="text" data-node="${n.id}" data-f="title" data-key="${n.id}.title" value="${esc(n.title)}" placeholder="${d?'Подузел':'Компонент результата'}" aria-label="Название узла">
 ${lvSel(n,'infl','Влияние на результат')}${lvSel(n,'unc','Неопределённость')}
 <span class="nacts"><button class="icon" data-act="add-node" data-parent="${n.id}" title="Добавить подузел" aria-label="Добавить подузел">+</button><button class="icon" data-act="park-node" data-id="${n.id}" title="В парковку" aria-label="Отправить в парковку">⚑</button><button class="icon" data-act="del-node" data-id="${n.id}" title="Удалить" aria-label="Удалить узел">×</button></span></div>`+treeHTML(t,n.id,d+1)).join('');
}
function skelHTML(t){
 const k=S.skel;if(!k||k.for!==t.id)return '';
 if(k.err)return `<p class="check">${esc(k.err)}</p>`;
 if(!k.items.length)return '';
 return `<div class="sugs"><div class="bhead"><h3>Предложение Claude</h3><span class="muted small">Это гипотеза, а не карта: бери то, что проходит тест полноты.</span></div>
 ${k.items.map((c,i)=>`<div class="sug" data-type="${c.type}"><span class="chip">${c.type?TYPES[c.type].name:'Без типа'}</span><b>${esc(c.title)}</b><button class="btn small" data-act="skel-add" data-i="${i}">Добавить</button>${c.why?`<small>${esc(c.why)}</small>`:''}</div>`).join('')}
 ${k.lens?`<p class="hint mt8">Больше всего пропусков показала линза: ${esc(k.lens)}</p>`:''}
 <div class="row mt8"><button class="btn small" data-act="skel-all">Добавить все</button><button class="btn ghost small" data-act="skel-close">Скрыть</button></div></div>`;
}
function mapBody(t){
 let h=`<div class="block"><div class="bhead"><h3>Первый уровень ${H('first-level')}</h3><span data-live="lvl1">${lvl1Text(t)}</span></div>
 ${filled(t.frame.result)?`<p class="goal">Результат: ${esc(t.frame.result)}</p>`:''}
 <div class="legend">${Object.entries(TYPES).map(([k,x])=>`<div data-type="${k}"><span class="chip">${x.name}</span><span>${x.hint}</span></div>`).join('')}</div>
 ${t.nodes.length?`<div class="tree-head" aria-hidden="true"><span>Тип</span><span>Узел</span><span>Влияние</span><span>Неопределён.</span><span></span></div>`:''}
 <div class="tree">${treeHTML(t,null,0)}</div>
 <div class="row mt8"><button class="btn" data-act="add-node">Добавить компонент</button>${S.ai?`<button class="btn ghost" data-act="ai-skel"${S.skelBusy?' disabled':''}>${S.skelBusy?'Claude думает…':'Предложить компоненты'}</button>`:''}</div>${skelHTML(t)}</div>`;
 h+=`<div class="block"><div class="bhead"><h3>Линзы полноты ${H('lenses')}</h3><span class="counter${lensCount(t)>=3?' ok':''}">${lensCount(t)} из 6</span></div>
 <div class="lenses">${LENSES.map(([k,n,d])=>`<label class="lens"><input type="checkbox" data-bind="lenses.${k}" data-key="lenses.${k}"${t.lenses[k]?' checked':''}><span><b>${n}</b><small>${d}</small></span></label>`).join('')}</div></div>`;
 const q={hh:[],hl:[],lh:[],ll:[]};
 t.nodes.filter(n=>n.infl&&n.unc).forEach(n=>q[(n.infl==='h'?'h':'l')+(n.unc==='h'?'h':'l')].push(n));
 const cell=(k,tt,d,hot)=>`<div class="mcell${hot?' hot':''}"><h4>${tt}</h4><p>${d}</p>${q[k].map(n=>`<span class="chip" data-type="${n.type||''}" title="${esc(n.title)}">${esc(short(n.title,34))}</span>`).join('')}</div>`;
 h+=`<div class="block"><h3>Где нужна глубина ${H('matrix')}</h3>
 <div class="matrix"><div class="axis-y">Влияние высокое</div>${cell('hh','Копать и пробовать','Сюда основное время.',1)}${cell('hl','Решить сразу','Записать и перейти к действию.')}
 <div class="axis-y">Влияние ниже</div>${cell('lh','Решить по умолчанию','Эвристикой или допущением, не исследовать.')}${cell('ll','Сделать не думая','Или вычеркнуть.')}
 <div></div><div class="axis-x">Неопределённость высокая</div><div class="axis-x">Неопределённость ниже</div></div></div>`;
 if(t.scale==='L'){
  const ang=k=>`<select data-bind="rebuild.${k}" data-key="rebuild.${k}" aria-label="Угол пересборки"><option value="">Выбери угол</option>${ANGLES.map(a=>`<option${t.rebuild[k]===a?' selected':''}>${esc(a)}</option>`).join('')}</select>`;
  h+=`<div class="block"><h3>Пересборка ${H('rebuild')}</h3>
  <div class="form"><div class="field"><div class="flabel">Версия А</div>${ang('aAngle')}<textarea class="mt6" rows="3" data-bind="rebuild.a" data-key="rebuild.a" aria-label="Версия А">${esc(t.rebuild.a||'')}</textarea></div>
  <div class="field"><div class="flabel">Версия Б</div>${ang('bAngle')}<textarea class="mt6" rows="3" data-bind="rebuild.b" data-key="rebuild.b" aria-label="Версия Б">${esc(t.rebuild.b||'')}</textarea></div>
  ${fieldHTML(t,{p:'rebuild.core',l:'Ядро: что совпало',type:'area',min:'L'})}${fieldHTML(t,{p:'rebuild.diff',l:'Расхождения',type:'area',min:'L'})}</div>
  <label class="checkline"><input type="checkbox" data-bind="rebuild.stable" data-key="rebuild.stable"${t.rebuild.stable?' checked':''}><span>Две последние пересборки не изменили первые два уровня</span></label></div>`;
 }
 return h;
}
function confText(t,n){
 const r=REV[n.rev||t.frame.rev];
 if(!filled(n.conf))return 'Уверенность не оценена — сдвинь ползунок.';
 if(!r)return `Уверенность ${n.conf}%. Задай обратимость, чтобы увидеть порог.`;
 if(+n.conf>=r.thr)return `${n.conf}% при пороге ${r.thr}%. Порог достигнут — решай.`;
 return `${n.conf}% из нужных ${r.thr}%. Не хватает данных — какая проба их даст, и что стоит ожидание?`;
}
function lvBadge(n){return (n.infl||n.unc)?`<span class="lv">влияние ${n.infl?LV[n.infl]:'—'}, неопределённость ${n.unc?LVF[n.unc]:'—'}</span>`:'';}
function decisionCard(t,n){
 const r=REV[n.rev||t.frame.rev];
 return `<article class="card" data-type="decision"><header class="chead"><span class="chip">Решение</span><h4>${esc(n.title||'Без названия')}</h4>${lvBadge(n)}</header><div class="form">
 ${nf(n,'options','Варианты','2–5 опций. Отказ решать — тоже вариант со своей ценой.','area')}
 ${nf(n,'criteria','Критерии','2–5 критериев, по которым сравниваешь.','area')}
 <div class="field wide"><div class="flabel">Обратимость</div>${revHTML(t,n)}</div>
 <div class="field wide"><label for="c_${n.id}">Уверенность в лучшем варианте</label><div class="conf"><input id="c_${n.id}" type="range" min="0" max="100" step="5" value="${filled(n.conf)?n.conf:50}" data-node="${n.id}" data-f="conf" data-key="${n.id}.conf">${r?`<span class="thr" style="left:${r.thr}%" title="Порог ${r.thr}%"></span>`:''}</div><p class="hint mt6" data-live="conf" data-arg="${n.id}">${confText(t,n)}</p></div>
 ${nf(n,'gut','Интуиция','Какой вариант тянет и что в нём тревожит? Сжатые данные с погрешностью: вход с весом, а не шум.','area')}
 ${nf(n,'deadline','Срок решения','','date')}${nf(n,'decided','Решено','Что выбрано. Заполняется, когда решение принято.','text')}
 </div></article>`;
}
function qchkHTML(n){return filled(n.changes)?'':`Без этого вопрос — любопытство. <button class="link" data-act="park-node" data-id="${n.id}">Отправить в парковку</button>`;}
function probeHTML(n){
 if(!n.probe)return `<div class="field wide"><p class="hint">Мышлением этот вопрос не снимается. Нужна минимальная проба — самый ранний контакт с реальностью.</p><button class="btn" data-act="make-probe" data-id="${n.id}">Спроектировать пробу</button></div>`;
 const o=n.probe.outcome||'';
 return `<div class="field wide probe"><div class="flabel">Проба</div><div class="form">
 ${nf(n,'probe.hyp','Гипотеза','Что именно я считаю правдой?','area')}
 ${nf(n,'probe.test','Минимальный тест','Разговор с человеком, пробный заказ, мини-запуск.','area')}

function gateHTML(t){

 <button class="btn" data-act="add-action">Добавить действие</button></div></div>`;

function calibHTML(list,withTask){
 const done=list.filter(s=>s.end);
 if(!done.length)return `<p class="muted">Сессий пока нет. Каждая сессия записывает прогноз времени и пользы, а в конце — факт. Через 20–30 записей видно, где ты систематически переоцениваешь глубину и недооцениваешь мелкие действия.</p>`;
 const sb=done.reduce((a,s)=>a+(+s.budget||0),0),sf=done.reduce((a,s)=>a+(+s.min||0),0);
 const ae=done.reduce((a,s)=>a+(+s.exp||0),0)/done.length,av=done.reduce((a,s)=>a+(+s.val||0),0)/done.length;
 let note='';
 if(done.length>=5){
  if(sf>sb*1.2)note+=' Сессии систематически длиннее плана — сужай вопрос сессии.';
  if(ae-av>1)note+=' Ожидаемая польза выше фактической — погружения переоцениваются.';
  if(av-ae>1)note+=' Фактическая польза выше ожидаемой — возможно, ты недооцениваешь такие действия.';
 }
 if(done.length<20)note+=` До надёжных выводов нужно 20–30 записей, сейчас ${done.length}.`;
 return `<p>Сессий: ${done.length}. Время: план ${fmtMin(sb)}, факт ${fmtMin(sf)}. Польза: ожидалась в среднем ${ae.toFixed(1)}, вышла ${av.toFixed(1)} из 10.<span class="muted">${note}</span></p>
 <div class="tbl"><table><thead><tr>${withTask?'<th>Задача</th>':''}<th>Вопрос сессии</th><th>Минут: план, факт</th><th>Польза: ожидал, вышло</th></tr></thead><tbody>${done.slice(0,40).map(s=>`<tr>${withTask?`<td>${esc(short(s.task,28))}</td>`:''}<td>${esc(s.q||'—')}</td><td class="num">${s.budget}, ${Math.round(s.min)}</td><td class="num">${s.exp}, ${s.val}</td></tr>`).join('')}</tbody></table></div>`;
}

/* ---------- rail ---------- */
R.rail=function(){
 const t=S.view==='task'?cur():null;let h='';
 if(t){
  h+=sessionHTML(t);
  const gs=taskGuards(t);
  h+=`<section class="rsec"><h3>Стражи ${H('guards')}${gs.length?`<span class="count">${gs.length}</span>`:''}</h3>${gs.length?gs.map(g=>`<button class="guard ${g.sev}" data-act="gnav" data-p="${g.p??''}"><b>${esc(g.trap)}</b><span>${esc(g.text)}</span></button>`).join(''):'<p class="muted small">Ловушек не видно. Стражи следят за бюджетом, шириной карты, пробами, сроками решений и лимитом незавершённого.</p>'}</section>`;
  if(t.scale!=='S')h+=aiHTML(t);
 }else if(S.view==='goal'&&goalById(S.goalId)){
  h+=goalRailHTML(goalById(S.goalId));
 }else if(S.view==='map'){
  h+=mapRailHTML();
 }else{
  const run=Object.values(S.tasks).find(x=>x.activeSession);
  if(run)h+=`<section class="rsec"><h3>Идёт сессия</h3><p class="small">${esc(run.title)}</p><button class="btn full" data-act="open-task" data-id="${run.id}">Открыть</button></section>`;
  const gg=globalGuards();
  h+=`<section class="rsec"><h3>Стражи системы ${H('life-guards')}${gg.length?`<span class="count">${gg.length}</span>`:''}</h3>${gg.length?gg.map(g=>`<button class="guard ${g.sev}"${g.tid?` data-act="open-task" data-id="${g.tid}"`:''}><b>${esc(g.trap)}</b><span>${esc(g.text)}</span></button>`).join(''):'<p class="muted small">Всё спокойно.</p>'}</section>`;
 }
 if(S.view!=='parking')h+=`<section class="rsec"><h3>Парковка ${H('parking')}</h3><input type="text" id="parkq" data-ubind="park.text" data-key="park.text" value="${esc(S.ui.park.text||'')}" placeholder="Мысль или ветка" aria-label="Что паркуешь"><input type="text" class="mt6" data-ubind="park.why" data-key="park.why" value="${esc(S.ui.park.why||'')}" placeholder="Почему интересно — одной строкой" aria-label="Почему интересно"><button class="btn full mt8" data-act="park-add">Запарковать</button></section>`;
 paint('rail',h);
};
function sessionHTML(t){
 const as=t.activeSession,u=S.ui.sess;
 if(!as){
  const other=Object.values(S.tasks).find(x=>x.activeSession&&x.id!==t.id);
  if(other)return `<section class="rsec"><h3>Сессия ${H('session')}</h3><p class="small">Идёт сессия в задаче «${esc(other.title)}».</p><button class="btn full" data-act="open-task" data-id="${other.id}">Открыть её</button></section>`;
  return `<section class="rsec"><h3>Сессия ${H('session')}</h3><label class="lbl" for="sq" style="margin-top:0">Вопрос сессии</label>
  <textarea id="sq" rows="2" data-ubind="sess.q" data-key="sess.q" placeholder="Какие 5 блоков у задачи?">${esc(u.q||'')}</textarea>
  <div class="lbl">Бюджет</div><div class="seg">${[25,45,90].map(m=>`<button data-act="sess-budget" data-v="${m}" aria-pressed="${+u.budget===m}">${m} мин</button>`).join('')}</div>
  <label class="lbl" for="sx">Ожидаемая польза: <b data-uv="sess.exp">${u.exp}</b> из 10</label><input id="sx" type="range" min="1" max="10" data-ubind="sess.exp" data-key="sess.exp" value="${u.exp}">
  <button class="btn primary full mt12" data-act="sess-start">Начать сессию</button></section>`;
 }
 const now=Date.now(),el=(now-as.start)/60000,over=el>as.budget,up=(now-as.lastUp)/60000>=S.global.stepUp;
 let end='';
 if(S.pendingEnd){const e=S.ui.end;end=`<div class="endf"><label class="lbl" for="ev">Фактическая польза: <b data-uv="end.val">${e.val}</b> из 10 <span class="muted">(ожидал ${as.exp})</span></label><input id="ev" type="range" min="1" max="10" data-ubind="end.val" data-key="end.val" value="${e.val}">
  <label class="lbl" for="ew">Где остановился</label><textarea id="ew" rows="2" data-ubind="end.where" data-key="end.where">${esc(e.where||'')}</textarea>
  <label class="lbl" for="en">Следующая гипотеза или шаг</label><textarea id="en" rows="2" data-ubind="end.next" data-key="end.next">${esc(e.next||'')}</textarea>
  <p class="hint mt6">Точка сохранения: возврат будет стоить минуту, а не час раскачки.</p>
  <div class="row mt8"><button class="btn primary" data-act="sess-save">Сохранить сессию</button><button class="btn ghost" data-act="sess-back">Ещё работаю</button></div></div>`;}
 return `<section class="rsec sess${over?' over':''}"><h3>Сессия идёт ${H('session')}</h3><div class="timer" id="timer">${clock(el)}</div><div class="muted small">из ${as.budget} мин, фаза «${PHASES[as.phase].name}»</div>
 <div class="pbar"><i id="tbar" style="width:${Math.min(100,el/as.budget*100).toFixed(1)}%"></i></div>${as.q?`<p class="sq">${esc(as.q)}</p>`:''}
 ${up&&!S.pendingEnd?`<div class="nudge"><b>Шаг вверх.</b> Прошло больше ${S.global.stepUp} минут. Эта ветка всё ещё важна для результата?<div class="row"><button class="btn small" data-act="sess-up">Да, продолжаю</button><button class="btn small" data-act="sess-park">Нет, паркую</button></div></div>`:''}
 ${S.pendingEnd?end:`<div class="row"><button class="btn" data-act="sess-up">Шаг вверх сделан</button><button class="btn primary" data-act="sess-end">Завершить</button></div><button class="btn ghost small mt8" data-act="sess-drop">Отменить без записи</button>`}</section>`;
}
function fmtAI(txt){
 return String(txt||'').replace(/\*\*/g,'').split(/\n+/).filter(l=>l.trim()).map(l=>{l=l.replace(/^[-•*#\s]+/,'');const m=l.match(/^([^:]{2,40}):\s*(.*)$/);return m?`<p><b>${esc(m[1])}:</b> ${esc(m[2])}</p>`:`<p>${esc(l)}</p>`;}).join('');
}
function aiHTML(t){return `<section class="rsec"><h3>ИИ-диагностика ${H('ai')}</h3>${aiBlock(t.ai,'t',t.id,'tech')}</section>`;}

/* ---------- markdown export ---------- */
function toMarkdown(t){
 const c=v=>String(v??'').replace(/\|/g,'/').replace(/\s*\n\s*/g,' ').trim()||'—';
 const L=[],ln=(k,v)=>{if(filled(v))L.push(`- ${k}: ${String(v).trim()}`);};
 L.push(`# Задача: ${t.title||'Без названия'}`);
 const b=+t.frame.budget;
 const _pl=placeText(t);if(_pl)L.push('Место в жизни: '+_pl+'.');
 L.push(`Масштаб: ${SCALES[t.scale].name}. Статус: ${statusText(t)}.${b?` Бюджет планирования: ${fmtMin(b*60)}, потрачено ${fmtMin(planSpent(t))}.`:''}${t.frame.exit?' Дата выхода: '+t.frame.exit+'.':''}`,'');
 L.push('## 1. Направление');ln('Зачем',t.frame.why);ln('А это зачем',t.frame.why2);ln('Другие пути к той же цели',t.frame.alt);ln('Результат (состояние)',t.frame.result);ln('Критерий готовности',t.frame.done);ln('Уровень «достаточно»',t.frame.enough);ln('Критерий остановки',t.frame.kill);L.push('');
 L.push('## 2. Поле');ln('Сырая формулировка',t.seed.raw);ln('Почему всплывает',t.seed.signal);ln('Эмоции и интуиция',t.seed.feel);ln('Цена бездействия за месяц',t.seed.inaction);ln('Ограничения',t.frame.constraints);ln('Рычаги',t.frame.levers);if(t.frame.rev)ln('Обратимость',REV[t.frame.rev].name);L.push('');
 L.push('## 3. Карта');
 const walk=(p,d)=>kids(t,p).forEach(n=>{L.push(`${'  '.repeat(d)}- [${n.type?TYPES[n.type].name:'без типа'}; влияние ${n.infl?LV[n.infl]:'?'}; неопределённость ${n.unc?LVF[n.unc]:'?'}] ${n.title||'—'}`);walk(n.id,d+1);});
 walk(null,0);if(!t.nodes.length)L.push('- пока пусто');
 L.push(`Линзы пройдены: ${LENSES.filter(([k])=>t.lenses[k]).map(x=>x[1]).join(', ')||'нет'}`,'');
 const decs=t.nodes.filter(n=>n.type==='decision');
 if(decs.length){L.push('## 4. Решения','| Решение | Опции | Критерии | Уверенность / порог | Интуиция | Срок | Решено |','|---|---|---|---|---|---|---|');decs.forEach(n=>{const r=REV[n.rev||t.frame.rev];L.push(`| ${c(n.title)} | ${c(n.options)} | ${c(n.criteria)} | ${filled(n.conf)?n.conf+'%':'—'} / ${r?r.thr+'%':'—'} | ${c(n.gut)} | ${c(n.deadline)} | ${c(n.decided)} |`);});L.push('');}
 const qs=t.nodes.filter(n=>n.type==='question');
 if(qs.length){L.push('## 5. Вопросы','| Вопрос | Вид | Что изменится после ответа | Способ или проба | Ответ / итог |','|---|---|---|---|---|');qs.forEach(n=>{const pr=n.probe?`Гипотеза: ${n.probe.hyp||'—'}; тест: ${n.probe.test||'—'}; подтвердилось, если: ${n.probe.crit||'—'}`:n.method;L.push(`| ${c(n.title)} | ${n.kind?KINDS[n.kind].name:'—'} | ${c(n.changes)} | ${c(pr)} | ${c(n.answer||(n.probe&&n.probe.result))} |`);});L.push('');}
 if(filled(t.frame.premortem)){L.push('## Пре-мортем',t.frame.premortem.trim(),'');}
 L.push('## 6. Исполнение');ln('Следующий шаг',t.exec.next);ln('Когда и где',t.exec.when);if(t.exec.min)ln('Минут',String(t.exec.min));ln('Решение, открывающее больше всего веток',t.exec.opener);ln('Критический путь',t.exec.path);
 const acts=t.nodes.filter(n=>n.type==='action');if(acts.length)L.push('- Действия: '+acts.map(n=>`${n.title||'—'} (${{todo:'очередь',doing:'в работе',done:'сделано'}[n.status||'todo']})`).join('; '));L.push('');
 if(t.scale==='L'&&(filled(t.rebuild.a)||filled(t.rebuild.b))){L.push('## 7. Пересборка');ln('Версия А ('+(t.rebuild.aAngle||'угол не выбран')+')',t.rebuild.a);ln('Версия Б ('+(t.rebuild.bAngle||'угол не выбран')+')',t.rebuild.b);ln('Ядро',t.rebuild.core);ln('Расхождения',t.rebuild.diff);L.push('');}
 L.push('## 8. Выход из планирования');gate(t).forEach(g=>L.push(`- [${g.ok?'x':' '}] ${g.text}`));L.push('');
 if(filled(t.save.where)){L.push('## Точка сохранения');ln('Где остановился',t.save.where);ln('Дальше',t.save.next);L.push('');}
 const gs=taskGuards(t);if(gs.length){L.push('## Сигналы стражей');gs.forEach(g=>L.push(`- ${g.trap}: ${g.text}`));}
 return L.join('\n');
}

/* ---------- modal ---------- */
function modal(html,focusSel){
 const root=$('#modal-root');S.lastFocus=document.activeElement;
 root.innerHTML=`<div class="scrim" data-act="modal-close"></div><div class="modal" role="dialog" aria-modal="true">${html}</div>`;root.hidden=false;
 root.querySelectorAll('textarea:not(.code)').forEach(grow);
 const f=root.querySelector(focusSel||'input,textarea,button');if(f)f.focus();
}
function closeModal(){const root=$('#modal-root');root.innerHTML='';root.hidden=true;S.confirmFn=null;if(S.lastFocus&&document.contains(S.lastFocus))S.lastFocus.focus();}
function confirmBox(title,text,ok,fn){S.confirmFn=fn;modal(`<h2 class="mtitle">${esc(title)}</h2><p>${esc(text)}</p><div class="row end mt16"><button class="btn ghost" data-act="modal-close">Отмена</button><button class="btn primary" data-act="confirm-ok">${esc(ok)}</button></div>`,'.btn.primary');}
function textModal(title,hint,text,file,mime){
 S.modalText={text,file,mime};
 modal(`<h2 class="mtitle">${esc(title)}</h2><p class="hint">${esc(hint)}</p><textarea class="code" id="mtext" readonly>${esc(text)}</textarea><div class="row end mt12">${S.dl?`<button class="btn" data-act="modal-save">Скачать файл</button>`:''}<button class="btn primary" data-act="modal-copy">Скопировать</button></div>`,'.btn.primary');
}
function newTaskModal(){
 S.ui.nt={title:'',scale:'M',start:'active',sphere:''};const sps=spheresSorted();
 modal(`<h2 class="mtitle">Новая задача</h2><label class="lbl" for="ntt" style="margin-top:0">Как называется</label><input id="ntt" type="text" data-ubind="nt.title" data-key="nt.title" placeholder="Например: обновить анкету на агрегаторе">
 ${sps.length?`<label class="lbl mt16" for="nts">Сфера жизни</label><select id="nts" data-ubind="nt.sphere"><option value="">Без сферы</option>${sps.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select>`:''}
 <div class="lbl mt16">Масштаб</div>${['S','M','L'].map(k=>`<label class="opt"><input type="radio" name="ntsc" value="${k}" data-ubind="nt.scale"${k==='M'?' checked':''}><span><b>${SCALES[k].name}</b><small>${SCALES[k].hint}</small></span></label>`).join('')}
 <div class="lbl mt16">Старт</div><label class="opt"><input type="radio" name="ntst" value="active" data-ubind="nt.start" checked><span><b>Сразу в работу</b><small>Начнёшь с рамки: зачем, результат, бюджет.</small></span></label><label class="opt"><input type="radio" name="ntst" value="seed" data-ubind="nt.start"><span><b>Пусть созреет</b><small>Записать сырую мысль и дату пересмотра. Для шага не нужно.</small></span></label>
 <div class="row end mt16"><button class="btn ghost" data-act="modal-close">Отмена</button><button class="btn primary" data-act="create-task">Создать</button></div>`,'#ntt');
}

/* ---------- navigation ---------- */
function openTask(id){const t=S.tasks[id];if(!t)return;S.view='task';S.current=id;S.viewPhase=t.phase;S.pendingEnd=false;saveUI();fullRender();window.scrollTo({top:0});}
function goPhase(p){S.viewPhase=p;R.work();const ph=$('.phead');if(ph&&ph.getBoundingClientRect().top<0)ph.scrollIntoView({block:'start'});}
function removeNodes(t,id){const ids=new Set([id]);let grew=true;while(grew){grew=false;t.nodes.forEach(n=>{if(n.parent&&ids.has(n.parent)&&!ids.has(n.id)){ids.add(n.id);grew=true;}});}t.nodes=t.nodes.filter(n=>!ids.has(n.id));t.nodes.forEach(n=>{if(ids.has(n.dep))n.dep='';});return ids.size;}
function addNode(t,parent,extra){const n={id:uid(),parent:parent||null,title:'',type:'',infl:'',unc:'',...(extra||{})};t.nodes.push(n);touch(t);return n;}
function focusKey(k){const go=()=>{const el=document.querySelector('[data-key="'+cssEsc(k)+'"]');if(el){el.focus({preventScroll:true});el.scrollIntoView({block:'nearest'});return true;}return false;};if(!go())requestAnimationFrame(go);}
function parkItem(text,why,taskId){S.global.parking.unshift({id:uid(),text,why:why||'',taskId:taskId||null,created:Date.now()});touchG();}

/* ---------- actions ---------- */
const A={
 'nav':a=>{S.view=a.dataset.v;S.current=null;saveUI();fullRender();window.scrollTo({top:0});},
 'open-task':a=>openTask(a.dataset.id),
 'new-task':()=>newTaskModal(),
 'create-task':()=>{const u=S.ui.nt,title=String(u.title||'').trim();if(!title){toast('Назови задачу — хотя бы черновым названием');focusKey('nt.title');return;}
  const t=newTask(title,u.scale||'M',u.start==='seed');t.sphere=u.sphere||'';S.tasks[t.id]=t;S.born.add(t.id);closeModal();Store.saveTask(t.id);openTask(t.id);
  if(t.scale==='S')focusKey('frame.result');else focusKey(t.status==='seed'?'seed.raw':'frame.why');},
 'modal-close':()=>closeModal(),
 'confirm-ok':()=>{const f=S.confirmFn;closeModal();if(f)f();},
 'modal-copy':async()=>{const ta=$('#mtext');try{await navigator.clipboard.writeText(S.modalText.text);toast('Скопировано');}catch(e){if(ta){ta.focus();ta.select();}toast('Текст выделен — нажми Ctrl+C или ⌘C');}},
 'modal-save':async()=>{const m=S.modalText;if(!S.dl||!m)return;try{const r=await S.dl.save({filename:m.file,data:m.text});if(r&&r.status==='saved')toast('Файл сохранён');}catch(e){if(e&&e.code!=='declined')toast('Скачать не получилось — скопируй текст');}},
 'scale':a=>{const t=cur();if(!t)return;t.scale=a.dataset.v;if(t.scale==='S'&&t.status==='seed')t.status='active';if(t.scale!=='S'&&t.phase===0&&t.status!=='seed')t.phase=1;if(t.scale==='M'&&!filled(t.frame.budget))t.frame.budget=0.5;S.viewPhase=t.phase;touch(t);fullRender();},
 'phase':a=>goPhase(+a.dataset.p),
 'gnav':a=>{const p=a.dataset.p;if(p===''||!cur()||cur().scale==='S'){window.scrollTo({top:0,behavior:'smooth'});return;}goPhase(+p);},
 'advance':a=>{const t=cur();if(!t)return;const p=+a.dataset.p;
  if(p===4&&!gate(t).every(g=>g.ok)){confirmBox('Критерии выхода выполнены не все','Можно выйти и так: неопределённость второго и третьего вида планированием не исчезает. Но проверь, нет ли вопросов, которые снимаются мышлением за минуты.','Всё равно выйти',()=>doAdvance(t,p));return;}
  doAdvance(t,p);},
 'setrev':a=>{const t=cur();if(!t)return;if(a.dataset.id){const n=nodeOf(t,a.dataset.id);if(n)n.rev=a.dataset.v;}else t.frame.rev=a.dataset.v;touch(t);R.work();},
 'kind':a=>{const t=cur(),n=t&&nodeOf(t,a.dataset.id);if(!n)return;n.kind=a.dataset.v;touch(t);R.work();},
 'setmet':a=>{const t=cur();if(!t)return;t.close.met=a.dataset.v;touch(t);R.work();},
 'add-node':a=>{const t=cur();if(!t)return;const par=a.dataset.parent||null;
  const go=()=>{const n=addNode(t,par);R.work();focusKey(n.id+'.title');};
  if(par){const pn=nodeOf(t,par),l1=lvl1(t);if(pn&&depth(t,pn)>=1&&(l1.length<3||l1.some(n=>!n.type))){confirmBox('Первый уровень ещё не покрыт','Это будет третий уровень, а на первом меньше трёх типизированных компонентов. Глубина без ширины не позволяет понять, важна ли эта ветка вообще.','Всё равно вглубь',go);return;}}
  go();},
 'del-node':a=>{const t=cur(),n=t&&nodeOf(t,a.dataset.id);if(!n)return;const del=()=>{removeNodes(t,n.id);touch(t);R.work();};
  if(kids(t,n.id).length)confirmBox('Удалить ветку?',`«${short(n.title,50)}» и все подузлы будут удалены.`,'Удалить',del);else del();},
 'park-node':a=>{const t=cur(),n=t&&nodeOf(t,a.dataset.id);if(!n)return;const go=()=>{parkItem(n.title||'Узел без названия',n.changes?'':'не видно, что изменит ответ',t.id);removeNodes(t,n.id);touch(t);R.work();toast('Узел в парковке');};
  if(kids(t,n.id).length)confirmBox('Запарковать ветку?','Узел уйдёт в парковку одной строкой, подузлы будут удалены.','Запарковать',go);else go();},
 'make-probe':a=>{const t=cur(),n=t&&nodeOf(t,a.dataset.id);if(!n)return;n.probe=n.probe||{};touch(t);R.work();focusKey(n.id+'.probe.hyp');},
 'move':a=>{const t=cur(),n=t&&nodeOf(t,a.dataset.id);if(!n)return;n.status=a.dataset.to;touch(t);R.work();if(a.dataset.to==='doing'&&t.nodes.filter(x=>x.type==='action'&&x.status==='doing').length>2)toast('В работе больше двух действий');},
 'add-action':()=>{const t=cur();if(!t)return;const u=S.ui.newAct,title=String(u.title||'').trim();if(!title){focusKey('newAct.title');return;}addNode(t,u.parent||null,{title,type:'action',status:'todo'});S.ui.newAct={parent:u.parent};R.work();focusKey('newAct.title');},
 'add-rule':()=>{const t=cur();if(!t)return;const r=String(t.close.rule||'').trim();if(!r){toast('Сначала сформулируй правило');focusKey('close.rule');return;}if(S.global.rules.some(x=>x.text===r)){toast('Такое правило уже есть');return;}S.global.rules.unshift({id:uid(),text:r,taskId:t.id,created:Date.now()});touchG();toast('Правило добавлено в DASH');},

function hzOf(k,o){if(k==='g')return o.horizon;const g=o.goal&&goalById(o.goal);return g?g.horizon:o.horizon;}

function itemRef(ref){
 const i=String(ref).indexOf(':'),k=ref.slice(0,i),id=ref.slice(i+1);
 if(k==='g'){const g=goalById(id);return g?{k,id,title:g.title||'Без названия',done:goalDone(g),obj:g}:null;}
 if(k==='t'){const t=S.tasks[id];return t?{k,id,title:t.title||'Без названия',done:taskDone(t),obj:t}:null;}
 return null;

const waitingOn=o=>(o.deps||[]).map(itemRef).filter(r=>r&&!r.done);
function wouldCycle(from,to){const seen=new Set();const st=[to];while(st.length){const r=st.pop();if(r===from)return true;if(seen.has(r))continue;seen.add(r);const x=itemRef(r);if(x)(x.obj.deps||[]).forEach(d=>st.push(d));}return false;}
function fixPlacement(t,f){

const KR={root:0,s:1,g:2,t:3,n:4};

function treeData(){

  const sn={key:'s:'+sp.id,kind:'s',id:sp.id,label:sp.name,color:sp.color,ch:[],obj:sp};
  S.road.goals.filter(g=>effGS(g)===sp.id&&(S.showDone||!goalDone(g))).sort((a,b)=>HR[a.horizon]-HR[b.horizon]||sortGoals(a,b)).forEach(g=>{
   const gn={key:'g:'+g.id,kind:'g',id:g.id,label:g.title||'Без названия',color:sp.color,ch:[],obj:g};
   goalTasks(g).filter(t=>S.showDone||!taskDone(t)).sort(sortTasks).forEach(t=>gn.ch.push(taskTreeNode(t,sp.color)));
   sn.ch.push(gn);
  });
  Object.values(S.tasks).filter(t=>!t.goal&&effSphere(t)===sp.id&&(S.showDone||!taskDone(t))).sort(sortTasks).forEach(t=>sn.ch.push(taskTreeNode(t,sp.color)));

const TH=40,TG=8,TWD=n=>({root:96,s:168,g:256,t:256,n:210})[n.kind],COLW=[96,168,256,256,210];
function layoutTree(root){

 const CX=d=>{let x=14;for(let i=0;i<d;i++)x+=(COLW[i]||210)+40;return x;};
 (function walk(n,d,par){
  n.par=par;const all=n.ch.filter(c=>KR[c.kind]<=S.treeDepth),vis=S.collapsed.has(n.key)?[]:all;
  n.hiddenN=all.length-vis.length;n.hasKids=all.length>0;
  if(!vis.length){n.y=cur;cur+=TH+TG;}else{const ys=vis.map(c=>walk(c,d+1,n));n.y=ys[0];vis.forEach(c=>edges.push([n,c]));}
  n.x=CX(d);nodes.push(n);return n.y;
 })(root,0,null);

}

  else {inner=`<span class="lbl2">${esc(n.label)}</span>${n.obj.status==='done'?'<span class="muted small">✓</span>':''}`;act=`data-act="sel" data-k="t" data-id="${n.tid}" data-type="${n.type||''}"`;}

 globalGuards().forEach(x=>g.push({...x,sel:x.tid?{k:'t',id:x.tid}:null}));

document.addEventListener('dragstart',e=>{const el=e.target.closest&&e.target.closest('[data-dnd]');if(!el)return;S.drag=el.dataset.dnd;e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain',S.drag);}catch(_){}requestAnimationFrame(()=>el.classList.add('dragging'));});
document.addEventListener('dragend',()=>{S.drag=null;document.querySelectorAll('.dragging,.over').forEach(x=>x.classList.remove('dragging','over'));});
document.addEventListener('dragover',e=>{const t=dropTarget(e.target);if(!t)return;e.preventDefault();e.dataTransfer.dropEffect='move';document.querySelectorAll('.over').forEach(x=>{if(x!==t)x.classList.remove('over');});t.classList.add('over');});
document.addEventListener('drop',e=>{
 const tg=dropTarget(e.target);if(!tg)return;e.preventDefault();
 const d=S.drag,k=d.slice(0,1),id=d.slice(2);S.drag=null;
 if(tg.dataset.dropgoal){const g=goalById(tg.dataset.dropgoal),t=S.tasks[id];if(g&&t){t.goal=g.id;t.sphere=g.sphere;touch(t);}}
 else{const [sid,hz]=tg.dataset.cell.split('|');
  if(k==='g'){const g=goalById(id);if(g){g.sphere=sid;g.horizon=hz;touchR();}}
  else{const t=S.tasks[id];if(t){t.goal='';t.sphere=sid;t.horizon=hz;touch(t);}}}
 refreshMap();
});
let rzT=0;window.addEventListener('resize',()=>{clearTimeout(rzT);rzT=setTimeout(()=>{if(S.view==='map'&&S.mapMode==='road')drawLinks();},120);});

const causeById=id=>S.road.causes.find(c=>c.id===id);
const objOf=ref=>{const x=itemRef(ref);return x?x.obj:null;};
const betsFor=cid=>[...S.road.goals.map(g=>['g',g]),...Object.values(S.tasks).map(t=>['t',t])].filter(([k,o])=>(o.against||[]).includes(cid));
function curCycle(){const c=S.road.cycles,l=c[c.length-1];return l&&!l.closed?l:null;}
function daysSince(ts){return Math.max(0,Math.floor((Date.now()-ts)/DAY));}
function agoText(ts){const d=daysSince(ts);return d===0?'сегодня':d+' '+plural(d,'день','дня','дней')+' назад';}
function attn(sid){
 const since=Date.now()-30*DAY,ts=Object.values(S.tasks).filter(t=>effSphere(t)===sid);
 const hrs=ts.reduce((a,t)=>a+t.sessions.filter(s=>(s.end||0)>since).reduce((b,s)=>b+(s.min||0),0),0)/60;
 const act=ts.filter(t=>t.status==='active').length+S.road.goals.filter(g=>effGS(g)===sid&&g.status==='active'&&g.horizon==='now').length;
 return {act,hrs,score:act+hrs};
}

function closeTip(){const p=$('#pop');if(p)p.remove();S.tipFor=null;}
A.tip=a=>{
 const key=a.dataset.tip||a.dataset.tt;
 if($('#pop')&&S.tipFor===a){closeTip();return;}
 closeTip();
 const t=a.dataset.tip?TIPS[a.dataset.tip]:{t:a.dataset.tt,what:a.dataset.tx};if(!t)return;
 const p=document.createElement('div');p.id='pop';p.className='pop';p.setAttribute('role','dialog');p.setAttribute('aria-label',t.t||'Подсказка');p.innerHTML=tipHTML(t);document.body.appendChild(p);
 const r=a.getBoundingClientRect(),vw=window.innerWidth,vh=window.innerHeight,w=p.offsetWidth,h=p.offsetHeight;
 let left=Math.min(Math.max(8,r.left-14),vw-w-8),top=r.bottom+8;if(top+h>vh-8)top=Math.max(8,r.top-h-8);
 p.style.left=left+'px';p.style.top=top+'px';S.tipFor=a;
};
A['tip-close']=()=>closeTip();
document.addEventListener('mousedown',e=>{const p=$('#pop');if(p&&!p.contains(e.target)&&!(e.target.closest&&e.target.closest('.pen')))closeTip();});
window.addEventListener('scroll',e=>{const p=$('#pop');if(p&&!p.contains(e.target))closeTip();},true);
window.addEventListener('resize',()=>closeTip());
A['tips-toggle']=()=>{S.tipsOn=!S.tipsOn;document.body.classList.toggle('notips',!S.tipsOn);closeTip();saveUI();R.nav();toast(S.tipsOn?'Подсказки включены':'Подсказки скрыты');};

/* ================= v4: полотно жизни, страница цели, ИИ-диагностика ================= */
const DPM=30.44;
const MON0=()=>{const d=new Date();return new Date(d.getFullYear(),d.getMonth(),1).getTime();};
function dParse(s){if(!s)return null;const t=Date.parse(s+'T00:00:00');return isNaN(t)?null:t;}
function sphereSat(sp){return filled(sp.sat)?+sp.sat:filled(sp.satAI)?+sp.satAI:5;}
function sphereFund(sp){return filled(sp.fund)?+sp.fund:filled(sp.fundAI)?+sp.fundAI:3;}
function spherePrio(sp){return sp?Math.round(sphereFund(sp)/5*(10-sphereSat(sp))*10)/10:0;}
const num=v=>String(v).replace('.',',');
function itemSph(k,o){return sphereById(k==='g'?effGS(o):effSphere(o))||null;}
function topRefOf(ref){const x=itemRef(ref);if(!x)return null;if(x.k==='t'&&x.obj.goal&&goalById(x.obj.goal))return 'g:'+x.obj.goal;return ref;}
const HZS={now:0,next:28,later:90},HZD={now:28,next:56,later:90,someday:60};
const monName=ts=>new Date(ts).toLocaleDateString('ru-RU',{month:'short'}).replace('.','');

function layoutCanvas(){
 const MW=S.cvZoom||200,CW=212,CH=118,RG=14,BG=34,TOPH=46,LEFTW=136,HOR=365;
 const m0=MON0(),today=Math.floor((Date.now()-m0)/DAY);
 const items=[...S.road.goals.filter(g=>S.showDone||!goalDone(g)).map(g=>({k:'g',o:g,ref:'g:'+g.id})),...Object.values(S.tasks).filter(t=>!t.goal&&(S.showDone||!taskDone(t))).map(t=>({k:'t',o:t,ref:'t:'+t.id}))].filter(i=>cvPass(i.k,i.o));
 const by={};items.forEach(i=>{by[i.ref]=i;i.pre=[];i.post=[];});
 const E=new Set(),edges=[],addE=(a,b)=>{if(!a||!b||a===b||!by[a]||!by[b])return;const key=a+'>'+b;if(E.has(key))return;E.add(key);edges.push([a,b]);by[b].pre.push(a);by[a].post.push(b);};
 items.forEach(i=>(i.o.deps||[]).forEach(d=>addE(topRefOf(d),i.ref)));
 Object.values(S.tasks).filter(t=>t.goal).forEach(t=>(t.deps||[]).forEach(d=>addE(topRefOf(d),'g:'+t.goal)));
 items.forEach(i=>{const o=i.o,hz=hzOf(i.k,o),sd=dParse(o.start),td=i.k==='g'?dParse(o.target):null;
  i.hz=hz;i.s0=sd!=null?Math.floor((sd-m0)/DAY):(hz==='someday'?null:today+HZS[hz]);i.e0=td!=null?Math.floor((td-m0)/DAY):null;i.prio=spherePrio(itemSph(i.k,o));});
 const indeg={};items.forEach(i=>indeg[i.ref]=i.pre.length);
 const q=items.filter(i=>!indeg[i.ref]),order=[];
 while(q.length){const i=q.shift();order.push(i);i.post.forEach(r=>{if(--indeg[r]===0)q.push(by[r]);});}
 items.forEach(i=>{if(!order.includes(i))order.push(i);});
 order.forEach(i=>{let s=i.s0;const pe=i.pre.map(r=>by[r]).filter(p=>p.e!=null).map(p=>p.e+1);if(pe.length)s=Math.max(s==null?0:s,...pe);i.s=s;
  i.e=s==null?null:Math.max(i.e0!=null?i.e0:0,s+HZD[i.hz||'now']);i.late=i.e0!=null&&s!=null&&i.e0<s;i.pushed=i.s0!=null&&s>i.s0+3;});
 const SOMX=LEFTW+12*MW+28;
 order.forEach(i=>{let x=(i.s==null||i.s>HOR)?SOMX:LEFTW+Math.max(0,i.s)/DPM*MW;i.pre.forEach(r=>{const p=by[r];if(p.x!=null)x=Math.max(x,p.x+CW+36);});i.x=x;});
 const par={},f=r=>par[r]===r?r:(par[r]=f(par[r]));items.forEach(i=>par[i.ref]=i.ref);edges.forEach(([a,b])=>{par[f(a)]=f(b);});
 const comps={};items.forEach(i=>{(comps[f(i.ref)]=comps[f(i.ref)]||[]).push(i);});
 const groups=[],singles={};
 Object.values(comps).forEach(list=>{if(list.length>1)groups.push(list);else{const key=(itemSph(list[0].k,list[0].o)||VIRT).id||'_';(singles[key]=singles[key]||[]).push(list[0]);}});
 Object.values(singles).forEach(l=>groups.push(l));
 const bands=groups.map(list=>({list,prio:Math.max(...list.map(i=>i.prio)),minS:Math.min(...list.map(i=>i.s==null?9999:i.s)),chain:list.some(i=>i.pre.length||i.post.length)}));
 bands.sort((a,b)=>b.prio-a.prio||(b.chain-a.chain)||a.minS-b.minS);
 let y=TOPH,maxX=SOMX+CW;
 bands.forEach(b=>{const rows=[];b.list.sort((a,c)=>a.x-c.x||c.prio-a.prio);

const VERD={ok:'в порядке',risk:'есть риски',stuck:'застряло'};
function aiKindFor(k,o){return k==='c'?(['env','res'].includes(o.type)?'tech':'psy'):'tech';}
function objFor(k,id){return k==='g'?goalById(id):k==='c'?causeById(id):S.tasks[id];}
function saveObj(k,o){if(k==='t')touch(o);else touchR();}
function aiBlock(ai,k,id,kind,compact){
 const title=kind==='psy'?'Психологическая диагностика':'Техническая диагностика';
 const busy=S.aiBusyRef===k+':'+id;
 const run=S.ai?`<button class="btn small aibtn" data-act="ai-run" data-k="${k}" data-id="${id}"${busy?' disabled':''}>${busy?'Claude анализирует…':ai?'Обновить диагностику':'Провести диагностику'}</button>`:'';
 if(!ai)return `<div class="aibox"><div class="aih"><span class="aitag">ИИ</span><b>${title}</b>${H(kind==='psy'?'ai-psy':'ai-tech')}</div><p class="muted small">Анализа пока нет.${S.ai?'':' Диагностика доступна, когда файл открыт в Claude.'}</p>${run}</div>`;
 const acc=(i,type,done)=>done?'<span class="muted small">принято</span>':`<button class="link small" data-act="ai-acc" data-k="${k}" data-id="${id}" data-t="${type}" data-i="${i}">Принять</button>`;
 return `<div class="aibox v-${ai.verdict||'ok'}"><div class="aih"><span class="aitag">ИИ</span><b>${title}</b>${H(kind==='psy'?'ai-psy':'ai-tech')}<span class="aiv">${VERD[ai.verdict]||''}</span><span class="muted small">${fmtDate(ai.at)}</span></div>
 ${ai.mechanism?`<p><span class="pk">Механизм (гипотеза).</span> ${esc(ai.mechanism)}</p>`:''}
 <p>${esc(ai.summary||'')}</p>
 ${(ai.hypotheses||[]).length?`<div class="aisec">Гипотезы</div>${ai.hypotheses.map((h,i)=>`<div class="aihyp"><div class="aihyp-t">${esc(h.text)}</div><div class="aiconf"><i style="width:${Math.max(4,Math.min(100,+h.conf||0))}%"></i></div><div class="small"><span class="muted">уверенность ${Math.round(+h.conf||0)}%.</span> Проверка: ${esc(h.test||'—')} ${acc(i,'h',h.accepted)}</div></div>`).join('')}`:''}
 ${(ai.metrics||[]).length&&!compact?`<div class="aisec">Метрики</div><table class="mtab"><tbody>${ai.metrics.map((m,i)=>`<tr><td>${esc(m.name)}<div class="muted small">${esc(m.how||'')}</div></td><td class="num">${esc(m.now||'?')} → ${esc(m.target||'?')}</td><td>${acc(i,'m',m.accepted)}</td></tr>`).join('')}</tbody></table>`:(ai.metrics||[]).length?`<div class="aisec">Метрики</div><p class="small">${esc(ai.metrics.map(m=>m.name+': '+(m.now||'?')+' → '+(m.target||'?')).join('; '))}</p>`:''}
 ${(ai.risks||[]).length?`<div class="aisec">Риски</div><ul class="airisk">${ai.risks.map(r=>`<li>${esc(r)}</li>`).join('')}</ul>`:''}
 ${ai.next?`<div class="aisec">Следующий шаг</div><p>${esc(ai.next)} ${acc(0,'n',ai.nextAccepted)}</p>`:''}
 ${ai.careNote?`<div class="aicare">${esc(ai.careNote)}</div>`:''}
 ${compact?`<p class="hv-foot">Полная диагностика — на странице ${k==='c'?'причины':'цели'}.</p>`:run}</div>`;
}
function aiData(k,o){
 if(k==='t')return toMarkdown(o);
 if(k==='g'){const sp=itemSph('g',o)||VIRT,ts=goalTasks(o);
  return [`Цель: ${o.title}`,`Сфера: ${sp.name} (приоритет ${num(spherePrio(sp))})`,`Горизонт: ${HZ[HR[o.horizon]].name}; статус: ${GST[o.status]}; старт: ${o.start||'—'}; срок: ${o.target||'—'}`,`Зачем: ${o.why||'—'}`,`Признак достижения: ${o.metric||'—'}`,`Ставка: ${o.bet||'—'}`,
   `Метрики: ${(o.metrics||[]).map(m=>m.name+' '+(m.now||'?')+'→'+(m.target||'?')).join('; ')||'—'}`,
   `Ждёт: ${(o.deps||[]).map(itemRef).filter(Boolean).map(r=>r.title+(r.done?' (готово)':'')).join('; ')||'—'}`,
   `Против проблем: ${(o.against||[]).map(causeById).filter(Boolean).map(c=>c.title+' ['+CSTAT[c.status]+']').join('; ')||'—'}`,
   `Подзадачи:\n${ts.map(t=>`- ${t.title} [${SCALES[t.scale].name}; ${statusText(t)}; следующий шаг: ${t.exec.next||'—'}; стражи: ${taskGuards(t).map(g=>g.trap).join(', ')||'нет'}]`).join('\n')||'- нет'}`,
   `Часы сессий: ${num((ts.reduce((a,t)=>a+t.sessions.reduce((b,s)=>b+(s.min||0),0),0)/60).toFixed(1))}`].join('\n');}
 const bets=betsFor(o.id).map(([kk,x])=>x.title);
 return [`Наблюдение человека о себе: ${o.title}`,`Тип: ${CTYPES[o.type].name}; статус: ${CSTAT[o.status]}; сфера: ${(sphereById(o.sphere)||VIRT).name}`,`Как проявляется: ${o.note||'—'}`,`Факты: ${o.evidence||'—'}`,`Всплывало в моменты растерянности: ${o.hits||0} раз`,`Связанные цели и задачи: ${bets.join('; ')||'—'}`].join('\n');
}
const AI_JSON='{"verdict":"ok|risk|stuck","summary":"1–2 предложения","hypotheses":[{"text":"гипотеза","conf":60,"test":"как проверить за 1–2 недели"}],"metrics":[{"name":"что измерять","now":"сейчас или «неизвестно»","target":"цель","how":"как и когда мерить"}],"risks":["риск"],"next":"одно конкретное действие на одну сессию"';
function aiPrompt(k,o){
 const kind=aiKindFor(k,o),data=aiData(k,o);
 if(kind==='psy')return `Ты — внимательный помощник по рефлексии. Опирайся на когнитивно-поведенческий подход и исследования мотивации. Проведи психологическую диагностику одного наблюдения человека о себе.
Это не клиническая диагностика: не ставь диагнозов и не используй клинические термины как установленный факт. Формулируй механизмы как гипотезы — бережно, конкретно, без морализаторства. Предлагай проверки, которые можно сделать в обычной жизни за 1–2 недели, и метрики самонаблюдения.
Если в данных есть признаки длительной подавленности, безнадёжности, проблем со сном или ощущения, что всё бессмысленно, заполни поле careNote: мягко предложи обсудить это с психотерапевтом или близким человеком. Иначе оставь careNote пустой строкой.

${data}

Ответь только JSON без пояснений и без Markdown: ${AI_JSON},"mechanism":"предполагаемый психологический механизм одной фразой","careNote":""}
2–3 гипотезы, 1–2 метрики, 1–2 риска. Пиши по-русски.`;
 return `Ты — аналитик эффективности личных проектов. Проведи техническую диагностику ${k==='g'?'цели':k==='t'?'задачи':'причины'}: реалистичность сроков, измеримость результата, узкие места и зависимости, соответствие действий цели, риски. Никаких общих советов — только выводы из данных ниже.

${data}

Ответь только JSON без пояснений и без Markdown: ${AI_JSON}}
2–3 гипотезы, 1–3 метрики, 1–3 риска. Пиши по-русски.`;
}
function aiClean(j,kind){
 const s=(v,n)=>String(v==null?'':v).slice(0,n);
 return {kind,verdict:['ok','risk','stuck'].includes(j.verdict)?j.verdict:'risk',summary:s(j.summary,500),mechanism:kind==='psy'?s(j.mechanism,240):'',
  hypotheses:(Array.isArray(j.hypotheses)?j.hypotheses:[]).slice(0,4).map(h=>({text:s(h.text,300),conf:Math.max(0,Math.min(100,+h.conf||0)),test:s(h.test,300)})).filter(h=>h.text),
  metrics:(Array.isArray(j.metrics)?j.metrics:[]).slice(0,4).map(m=>({name:s(m.name,120),now:s(m.now,60),target:s(m.target,60),how:s(m.how,200)})).filter(m=>m.name),
  risks:(Array.isArray(j.risks)?j.risks:[]).slice(0,4).map(r=>s(r,240)).filter(Boolean),next:s(j.next,240),careNote:kind==='psy'?s(j.careNote,400):'',at:Date.now(),src:'live'};
}
async function aiRun(k,id){
 const o=objFor(k,id);if(!o||!S.ai||S.aiBusyRef)return;
 const kind=aiKindFor(k,o);S.aiBusyRef=k+':'+id;fullRender(true);
 try{const j=await S.ai.json(aiPrompt(k,o),{modelTier:'default'});const o2=objFor(k,id);if(o2){o2.ai=aiClean(j||{},kind);saveObj(k,o2);}toast('Диагностика обновлена');}
 catch(e){toast(aiErrText(e));aiGone(e);}
 finally{S.aiBusyRef=null;fullRender(true);}
}

 items.forEach(i=>{const seen=new Set(),st=[...i.post];while(st.length){const r=st.pop();if(seen.has(r))continue;seen.add(r);by[r].post.forEach(x=>st.push(x));}i.desc=seen.size;});

 G.items.forEach(i=>{

  const Q=i.k==='t'?({S:1,M:.6,L:.25})[i.o.scale]:(()=>{const r=goalTasks(i.o).filter(t=>!taskDone(t)).length;return r===0?.5:1/(1+r*.5);})();

  b.y=y;b.list.forEach(i=>{i.y=y+i.row*(CH+RG);});b.h=rows.length*(CH+RG)-RG;y+=b.h+BG;

 if(k==='t')return ({repeat:o.status!=='seed'||filled(o.seed.review),formulate:filled(o.frame.result),reality:filled(o.frame.why),level:o.scale==='S'||filled(o.frame.budget),above:!!(o.goal||o.sphere),cause:o.scale==='S'||lvl1(o).length>=3,solution:o.scale==='S'||o.nodes.filter(n=>n.type==='decision').every(n=>filled(n.decided)),probe:o.scale==='S'||o.nodes.filter(n=>n.type==='question'&&n.kind==='data').every(n=>n.probe&&filled(n.probe.result)),assess:o.scale==='S'||gate(o).every(x=>x.ok),stabilize:taskDone(o),standard:filled(o.close.rule)})[s]||false;

function pathState(k,o){

}

}

 const draw=(node,lvl,a0,a1,color)=>{
  const sat=nodeSat(node),op=sat==null?.12:.18+sat/10*.72,mid=(a0+a1)/2,[r0,r1]=R[lvl-1];
  s+=`<path class="sb${sat==null?' none':''}" d="${arc(r0,r1,a0+.004,a1-.004)}" style="fill:${color};fill-opacity:${op.toFixed(2)}" data-act="sel" data-k="${lvl===1?'s':'a'}" data-id="${node.id}"><title>${esc(LVLN[lvl]+': '+node.name)} — ${sat==null?'нет оценки':sat+' из 10'}</title></path>`;
  if((a1-a0)*(r0+r1)/2>38&&lvl<=2){const rr=(r0+r1)/2,x=cx+rr*Math.cos(mid),y=cy+rr*Math.sin(mid);s+=`<text x="${x.toFixed(1)}" y="${(y+3).toFixed(1)}" text-anchor="middle" class="sbt l${lvl}">${esc(short(node.name,lvl===1?11:14))}</text>`;}
  const ch=childrenOf(node.id);if(ch.length&&lvl<4){const w=(a1-a0)/ch.length;ch.forEach((c,i)=>draw(c,lvl+1,a0+i*w,a0+(i+1)*w,color));}
 };
 sps.forEach((sp,i)=>draw(sp,1,-Math.PI/2+i*TAU/n,-Math.PI/2+(i+1)*TAU/n,sp.color));
 const all=sps.map(nodeSat).filter(v=>v!=null),avg=all.length?Math.round(all.reduce((a,b)=>a+b,0)/all.length*10)/10:null;
 return s+`<circle cx="${cx}" cy="${cy}" r="54" class="sbc"/><text x="${cx}" y="${cy-4}" text-anchor="middle" class="sbcn">${avg==null?'—':num(avg)}</text><text x="${cx}" y="${cy+14}" text-anchor="middle" class="sbcl">среднее</text></svg>`;
}

function contradictions(){
 const out=[],add=(t,x,sel)=>out.push({t,x,sel});
 S.road.goals.filter(g=>!goalDone(g)).forEach(g=>{if(!(g.against||[]).length)add('Цель без проблемы',`«${short(g.title,50)}»: не связана ни с одной проблемой — неясно, что она решает.`,{k:'g',id:g.id});});
 S.road.causes.forEach(c=>{const bets=betsFor(c.id);if(domainOf('c',c)==='subj'&&bets.length&&bets.every(([k,o])=>domainOf(k,o)==='obj'))add('Психологическое решается задачами',`«${short(c.title,50)}» субъективная, а против неё работают только объективные задачи.`,{k:'c',id:c.id});
  if(c.status==='ok'&&!bets.length)add('Подтверждённая проблема без ставки',`«${short(c.title,50)}»`,{k:'c',id:c.id});
  if(c.depth==='symptom'&&bets.length&&!S.road.causes.some(x=>(x.leadsTo||[]).includes(c.id)))add('Лечится симптом',`«${short(c.title,50)}» помечена как симптом, но причины под ней не найдены.`,{k:'c',id:c.id});});
 S.road.goals.filter(g=>!goalDone(g)).forEach(g=>{const bad=(g.against||[]).map(causeById).filter(c=>c&&c.status==='off');if(bad.length)add('Ставка против снятой проблемы',`«${short(g.title,50)}» работает против проблемы, которая снята.`,{k:'g',id:g.id});});
 if((S.road.motives||[]).length)S.road.goals.filter(g=>g.status==='active'&&!(g.motives||[]).length).forEach(g=>add('Цель мимо ядра',`«${short(g.title,50)}» не привязана к мотиву — она живёт на уровне способов.`,{k:'g',id:g.id}));
 const en=spheresSorted().find(s=>s.need==='body'&&(nodeSat(s)??10)<=4);if(en)S.road.goals.filter(g=>!goalDone(g)&&g.focus&&rootOf(g.area||g.sphere)!==en.id&&domainOf('g',g)==='obj').slice(0,1).forEach(g=>add('Усталость против дисциплины',`Сфера «${en.name}» просела, а в фокусе — объективные цели других сфер. Проверь, хватит ли ресурса.`,{k:'g',id:g.id}));
 return out;
}

 <div class="block"><h3>Почему уходит из плана</h3>${(()=>{const r={};cl.forEach(c=>Object.entries(c.reasons||{}).forEach(([k,v])=>r[k]=(r[k]||0)+v));const tot=Object.values(r).reduce((a,b)=>a+b,0)||1,top=Object.entries(r).sort((a,b)=>b[1]-a[1]);return top.map(([k,v])=>`<div class="rbar"><span>${REASONS[k]}</span><div class="attbar"><i style="width:${Math.round(v/tot*100)}%"></i></div><b>${v}</b></div>`).join('')+(top[0]?`<p class="hint mt8">${({impulse:'Больше всего уходит импульсов. Помогает правило: новое попадает в план только после двух недель в сигналах.',symptom:'Чаще всего уходят симптомы. Прежде чем брать в план, проверяй уровень проблемы на пути.',stale:'Многое теряет актуальность. Сокращай горизонт и держи в плане меньше целей.',noise:'Много сырого шума. Включи «Без шума» на полотне и не поднимай в план элементы ниже уровня «Проверено».',done:'Многое уже сделано, но висит в плане — закрывай элементы сразу.',merged:'Элементы часто дублируют друг друга — проверяй связи перед созданием нового.'})[top[0][0]]}</p>`:'');})()}</div>`:'<p class="hint">Статистика появится после первой чистки.</p>';

function elSide(k,o){if(k==='c')return 'P';if(k==='m')return ['hyp','question','obs','reflection','state','pattern','constraint'].includes(o.type)?'P':'A';return 'A';}
function elGroup(k,o){return (domainOf(k,o)==='subj'?'subj':'obj')+elSide(k,o);}
