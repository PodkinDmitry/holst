/* ---------- расчёт рекомендаций ---------- */
function mScore(k,o,m){
 const g=elGroup(k,o),kind=elKind(k,o),st=pathState(k,o),cur=st.cur,bp=(o.bp&&o.bp.steps)||[];
 let s=0,why=[];
 if(m.d.includes(g)){s+=40;why.push('подходит для: '+GROUPN[g].toLowerCase());}
 else if(m.d.some(d=>d.slice(-1)===g.slice(-1))){s+=12;why.push('та же сторона: '+(g.slice(-1)==='P'?'проблема':'решение'));}
 if((KIND_EXTRA[kind]||[]).includes(m.id)){s+=25;why.push('для вида «'+elKindName(k,o).toLowerCase()+'»');}
 if(cur&&m.s===cur.seg){s+=20;why.push('текущий отрезок пути');}
 if(cur&&m.pk===cur.key){s+=15;why.push('закрывает следующую веху');}
 const done=st.steps.find(x=>x.key===m.pk);if(done&&done.done){s-=15;why.push('веха уже пройдена');}
 if(bp.some(x=>x.m===m.id)){s-=40;why.push('уже в каркасе');}
 return {s:Math.max(0,Math.min(100,s)),why};
}
function recommendSet(k,o){
 const g=elGroup(k,o),kind=elKind(k,o),pool=[...new Set([...(KIND_EXTRA[kind]||[]),...(GROUP_BASE[g]||[])])].filter(mById);
 const order=SEGS.map(s=>s[0]),scored=pool.map(id=>({id,s:mScore(k,o,mById(id)).s})).sort((a,b)=>b.s-a.s),per={},pick=[];
 scored.forEach(x=>{const sg=mById(x.id).s;if((per[sg]||0)<2&&pick.length<8){per[sg]=(per[sg]||0)+1;pick.push(x.id);}});
 return pick.sort((a,b)=>mOrd(mById(a))-mOrd(mById(b)));
}
function buildSteps(ids){
 const out=[],order=SEGS.map(s=>s[0]);let lastSeg='';
 ids.map(mById).filter(Boolean).sort((a,b)=>mOrd(a)-mOrd(b)).forEach(m=>{
  if(lastSeg&&m.s!==lastSeg){if(lastSeg==='select')out.push({type:'calc',seg:'select'});if(lastSeg==='check')out.push({type:'ai',seg:'check'});}
  out.push({type:'m',m:m.id,f:{},done:false});lastSeg=m.s;});
 if(lastSeg==='check')out.push({type:'ai',seg:'check'});
 out.push({type:'calc',seg:'operate'});
 return out;
}

const CALC_T={select:'Расчёт: вердикт отбора',check:'Расчёт: проверка ставок',operate:'Расчёт: кристаллизация'};
function calcStep(k,o,seg){
 const m=maturity(k,o),st=pathState(k,o);const segSteps=st.steps.filter(s=>s.seg===seg),done=segSteps.filter(s=>s.done).length;
 let verdict='',lines=[`Зрелость: ${m.label} (${m.score}%)`,`Вехи отрезка «${SEGS.find(s=>s[0]===seg)[1]}»: ${done} из ${segSteps.length}`];
 if(seg==='select'){const need=segSteps.filter(s=>!s.done).map(s=>s.name);verdict=need.length?`Не пройдено: ${need.join(', ')}. Без этого решение может быть мимо.`:'Отбор пройден: можно искать причину и решение.';if(k==='c'&&o.fact==='interp')verdict='Проблема построена на интерпретации — проверь, не надумана ли она, прежде чем решать.';}
 if(seg==='check'){const bets=k==='c'?betsFor(o.id).length:(o.against||[]).length;lines.push(k==='c'?`Ставок против неё: ${bets}`:`Связанных проблем: ${bets}`);verdict=bets?'Есть что проверять: запусти пробу и запиши результат.':(k==='c'?'Нет ни одной ставки: проблема описана, но не решается.':'Не связано ни с одной проблемой: неясно, что это решает.');}
 if(seg==='operate'){const rule=k==='t'?o.close.rule:o.rule;verdict=filled(rule)?'Вывод записан — элемент кристаллизован.':'Запиши вывод или правило — без него опыт не накопится.';}
 return `<div class="cpcalc"><div class="cp-h">⚙ ${CALC_T[seg]}${HT('Расчёт файла','Внутренний калькулятор пересчитывает зрелость и путь по заполненным данным. ИИ здесь не участвует.')}</div><ul>${lines.map(l=>`<li>${esc(l)}</li>`).join('')}</ul><p class="small"><b>${esc(verdict)}</b></p></div>`;
}

 <div class="bprec">${rec.map(id=>{const m=mById(id);return `<span class="chip">${esc(m.n)}</span>`;}).join('')}</div>
 <div class="row mt8"><button class="btn primary" data-act="bp-build" data-ref="${ref}">Собрать рекомендованный каркас</button>${S.ai?`<button class="btn aibtn" data-act="bp-ai" data-ref="${ref}"${S.aiBusyRef==='bp:'+ref?' disabled':''}>${S.aiBusyRef==='bp:'+ref?'Claude подбирает…':'✦ Подобрать набор с ИИ'}</button>`:''}<button class="btn ghost" data-act="bp-empty" data-ref="${ref}">Начать с пустого</button></div>${o.bpAI?bpAIBox(k,o):''}</div>`;
 const doneN=bp.steps.filter(s=>s.type==='m'&&s.done).length,totalN=bp.steps.filter(s=>s.type==='m').length;
 let segPrev='';
 const steps=bp.steps.map((s,i)=>{
  if(s.type==='calc')return calcStep(k,o,s.seg);
  if(s.type==='ai')return `<div class="cpai"><div class="cp-h"><span class="aitag">ИИ</span> Ревью отрезка «${SEGS.find(x=>x[0]===s.seg)[1]}»</div>${s.ai?aiBlock(s.ai,'bpai',ref+'|'+i,'tech',true):'<p class="small muted">Claude прочитает заполненные поля и скажет, можно ли идти дальше.</p>'}${S.ai?`<button class="btn small aibtn" data-act="bp-review" data-ref="${ref}" data-i="${i}"${S.aiBusyRef==='rv:'+ref+i?' disabled':''}>${S.aiBusyRef==='rv:'+ref+i?'Claude читает…':s.ai?'Повторить ревью':'Запустить ревью'}</button>`:''}</div>`;
  const m=mById(s.m);if(!m)return '';

 repeat:{note:'Число повторов попадёт в счётчик повторяемости элемента.',fx:(k,o,f)=>{const n=Math.max(...Object.values(f).map(firstNum).filter(x=>x!=null),0);if(n&&k==='c')o.hits=Math.max(o.hits||0,n);if(n&&k==='m')o.repeats=Math.max(o.repeats||1,n);}},

 rolfe:{note:'«Что теперь» станет следующим шагом.',fx:(k,o,f)=>{const n=f['Что теперь'];if(!filled(n))return;if(k==='g')o.next=n;else if(k==='t')o.exec.next=n;}},

 woop:{note:'План «если… то…» станет ставкой.',fx:(k,o,f)=>{const v=Object.entries(f).find(([a])=>/Если/.test(a));if(v&&filled(v[1])&&(k==='g'||k==='t'))o.bet=o.bet||v[1];}},

 bexp:{note:'Вывод эксперимента дополнит факты.',fx:(k,o,f)=>{if(filled(f['Вывод'])&&k==='c')o.evidence=f['Вывод'];}},

function causeLayout(){
 const CW=212,CH=104,RG=12,BG=30,TOPH=42,LEFTW=136,COLW=CW+70;
 const ps=S.road.causes.filter(c=>cvPass('c',c)&&(S.showDone||c.status!=='off')),by={};ps.forEach(c=>by[c.id]={c,pre:[],post:[]});
 const edges=[];ps.forEach(c=>(c.leadsTo||[]).forEach(t=>{if(by[t]&&t!==c.id){edges.push([c.id,t]);by[c.id].post.push(t);by[t].pre.push(c.id);}}));
 const memo={},dist=id=>{if(memo[id]!=null)return memo[id];memo[id]=0;const p=by[id].post;memo[id]=p.length?1+Math.max(...p.map(dist)):0;return memo[id];};
 ps.forEach(c=>dist(c.id));
 const par={},f=x=>par[x]===x?x:(par[x]=f(par[x]));ps.forEach(c=>par[c.id]=c.id);edges.forEach(([a,b])=>{par[f(a)]=f(b);});
 const comps={};ps.forEach(c=>{(comps[f(c.id)]=comps[f(c.id)]||[]).push(by[c.id]);});
 const bands=Object.values(comps).map(list=>({list,prio:Math.max(...list.map(n=>spherePrio(sphereById(rootOf(n.c.area||n.c.sphere))))),depth:Math.max(...list.map(n=>memo[n.c.id]))}));
 bands.sort((a,b)=>b.prio-a.prio||b.list.length-a.list.length);
 const maxD=Math.max(0,...bands.map(b=>b.depth));
 let y=TOPH,maxX=LEFTW+CW;
 bands.forEach(b=>{const rows={};b.list.forEach(n=>{const col=(!n.pre.length&&n.post.length)?0:maxD-memo[n.c.id];n.x=LEFTW+col*COLW;n.col=col;});
  const cols=[...new Set(b.list.map(n=>n.col))];let h=0;cols.forEach(col=>{const inCol=b.list.filter(n=>n.col===col);inCol.forEach((n,i)=>{n.y=y+i*(CH+RG);});h=Math.max(h,inCol.length*(CH+RG)-RG);});
  b.y=y;b.h=h;y+=h+BG;b.list.forEach(n=>{maxX=Math.max(maxX,n.x+CW);});
  b.spheres=[...new Set(b.list.map(n=>(sphereById(rootOf(n.c.area||n.c.sphere))||VIRT).name))];});
 return {by,edges,bands,W:maxX+300,Ht:y,CW,CH,LEFTW,TOPH,COLW,maxD};
}

function asScore(a,ans){
 const [lo,hi]=a.scale,dims={};Object.keys(a.dims).forEach(d=>{const v=a.items.map((it,i)=>[it[0],ans[i]]).filter(([dd,x])=>dd===d&&x!=null&&x!=='').map(([dd,x])=>+x);if(v.length)dims[d]=Math.round(((v.reduce((s,x)=>s+x,0)/v.length)-lo)/(hi-lo)*100)/10;});
 let sum;if(a.id==='wb'){const v=ans.filter(x=>x!=null&&x!=='').map(Number);sum=v.length===a.items.length?v.reduce((s,x)=>s+x,0)*4:null;}
 else if(a.id==='swls'){const v=ans.filter(x=>x!=null&&x!=='').map(Number);sum=v.length===a.items.length?v.reduce((s,x)=>s+x,0):null;}
 else if(a.id==='stress'){sum=dims.T!=null?num(dims.T)+' / '+num(dims.V??0):null;}
 else{const v=Object.values(dims);sum=v.length?num(Math.round(v.reduce((s,x)=>s+x,0)/v.length*10)/10):null;}
 return {dims,sum};
}

 if(a.id==='swls'){const s=res.sum;if(s==null)return '';return s<=9?'Сильная неудовлетворённость жизнью.':s<=14?'Неудовлетворённость.':s<=19?'Скорее неудовлетворённость.':s===20?'Нейтрально.':s<=25?'Скорее удовлетворённость.':s<=30?'Удовлетворённость.':'Высокая удовлетворённость.';}

}

/* ---------- метрики модуля ---------- */
function mvMetrics(){
 const now=Date.now(),old=S.road.goals.filter(g=>g.created&&now-g.created>=90*DAY),alive=old.filter(g=>!['dropped'].includes(g.status));
 const act=S.road.goals.filter(g=>g.status==='active'),cov=act.length?act.filter(g=>(g.motives||[]).length).length/act.length:0,syn=act.length?act.reduce((a,g)=>a+(g.motives||[]).length,0)/act.length:0;
 const pairs=S.road.goals.filter(g=>g.forecast&&g.fact&&filled(g.forecast.sat)&&filled(g.fact.sat)),cal=pairs.length?pairs.reduce((a,g)=>a+Math.abs(+g.forecast.sat-+g.fact.sat),0)/pairs.length:null;
 const ms=S.road.motives||[],impTot=ms.reduce((a,m)=>a+(+m.imp||0),0);let beh={},behTot=0;Object.values(S.tasks).forEach(t=>{const mins=t.sessions.reduce((a,s)=>a+(s.min||0),0);(t.motives||[]).forEach(id=>{beh[id]=(beh[id]||0)+mins/(t.motives.length);behTot+=mins/(t.motives.length);});});(S.road.energy||[]).forEach(e=>(e.motives||[]).forEach(id=>{beh[id]=(beh[id]||0)+15;behTot+=15;}));
 const congr=impTot&&behTot?ms.reduce((a,m)=>a+Math.abs((+m.imp||0)/impTot-(beh[m.id]||0)/behTot),0)/2:null;
 return {survival:old.length?Math.round(alive.length/old.length*100):null,oldN:old.length,coverage:Math.round(cov*100),synergy:Math.round(syn*10)/10,congr:congr==null?null:Math.round(congr*100),calib:cal==null?null:Math.round(cal*10)/10,debt:ms.filter(m=>mvDebt(m)).length};
}

 <div class="ellabels"><div class="seg">${Object.entries(SIGT).map(([k,n])=>`<button data-act="w-set" data-id="${w.id}" data-f="sigType" data-v="${k}" aria-pressed="${w.sigType===k}">${n}</button>`).join('')}</div><div class="seg"><button data-act="w-set" data-id="${w.id}" data-f="depth" data-v="fast" aria-pressed="${!deep}">Быстрый путь</button><button data-act="w-set" data-id="${w.id}" data-f="depth" data-v="deep" aria-pressed="${deep}">Глубокий разбор</button></div>${H('depthrule')}<span class="chip">${({new:'новое',parsed:'разобрано',quar:'в карантине',released:'отпущено',accepted:'принято'})[w.status]||w.status}</span></div></header>
 ${!deep?`<section class="gp-sec"><h3>Три вопроса ${H('fastpath')}</h3><div class="form">${[['why','Что это мне даст?','уровень'],['voice','Чей это голос?','источник'],['alt','Что ещё дало бы то же?','замена']].map(([k,q,s])=>`<div class="field wide"><label for="wq_${w.id}_${k}">${q} <span class="muted small">— ${s}</span></label><textarea id="wq_${w.id}_${k}" rows="1" data-wf="${w.id}|q.${k}" data-key="wq.${w.id}.${k}">${esc((w.q||{})[k]||'')}</textarea></div>`).join('')}</div>
 <div class="row mt12"><select data-act-change="w-link" data-id="${w.id}" aria-label="Связать с мотивом ядра"><option value="">Связать с мотивом ядра…</option>${(S.road.motives||[]).map(m=>`<option value="${m.id}">${esc(short(m.formula,60))}</option>`).join('')}<option value="__new">+ Новый мотив-гипотеза из ответа «даст»</option></select><button class="btn small" data-act="w-quar" data-id="${w.id}">В карантин</button><button class="btn small ghost" data-act="w-release" data-id="${w.id}">Отпустить</button><button class="link small" data-act="w-set" data-id="${w.id}" data-f="depth" data-v="deep">Нужен глубокий разбор →</button></div></section>`
 :`<section class="gp-sec"><h3>Лестница в четыре стороны ${H('ladder')}</h3><div class="ladder">${ladderCol('up')}<div class="lad-mid">${ladderCol('back')}<div class="lad-c"><b>${esc(w.text)}</b><span class="muted small">исходное желание</span></div>${ladderCol('side')}</div>${ladderCol('down')}</div></section>

 <section class="gp-sec"><h3>Состав сплава ${H('alloy')}</h3><div class="alloy">${(w.alloy||[]).map((a,i)=>`<div class="arow2"><input type="text" data-wf="${w.id}|alloy.${i}.t" data-key="wa.${w.id}.${i}" value="${esc(a.t||'')}" placeholder="Компонент" aria-label="Компонент"><select data-act-change="w-alloy" data-id="${w.id}" data-i="${i}" data-f="cl" aria-label="Потребность"><option value="">—</option>${CL.map(c=>`<option value="${c.id}"${a.cl===c.id?' selected':''}>${esc(c.n)}</option>`).join('')}</select><select data-act-change="w-alloy" data-id="${w.id}" data-i="${i}" data-f="src" aria-label="Источник"><option value="">Источник</option>${FILTERS[1].opts.concat(['Компенсация']).map(o=>`<option${a.src===o?' selected':''}>${o}</option>`).join('')}</select><div class="seg"><button data-act="w-alloy-v" data-id="${w.id}" data-i="${i}" data-v="true" aria-pressed="${a.ver==='true'}">Истинный</button><button data-act="w-alloy-v" data-id="${w.id}" data-i="${i}" data-v="false" aria-pressed="${a.ver==='false'}">Наносной</button></div><input type="number" min="0" max="100" data-wf="${w.id}|alloy.${i}.share" data-key="was.${w.id}.${i}" value="${esc(a.share??'')}" placeholder="%" aria-label="Доля" style="width:64px">${a.ai?'<span class="aitag sm">гипотеза ИИ</span>':'<span></span>'}<button class="icon" data-act="w-alloy-del" data-id="${w.id}" data-i="${i}" aria-label="Удалить">×</button></div>`).join('')}</div><div class="row mt6"><button class="btn small" data-act="w-alloy-add" data-id="${w.id}">+ компонент</button>${S.ai?`<button class="btn small aibtn" data-act="w-alloy-ai" data-id="${w.id}"${S.aiBusyRef==='wa:'+w.id?' disabled':''}>✦ Гипотеза состава</button>`:''}</div></section>
 <section class="gp-sec"><h3>Вердикт и операция ${H('verdicts')}</h3><p class="small">Расчёт файла: <b>${VERDICTS[auto]}</b>. ${({true:'Можно в ядро или в план.',alloy:'Отдели наносные компоненты и ищи способ, кормящий только истинные.',swap:'Подними уровень и подбери способ заново.',alien:'Пересогласуй или отпусти.',data:'Карантин с датой и малый тест.'})[auto]}</p>
 <div class="seg wrap">${Object.entries(VERDICTS).map(([k,n])=>`<button data-act="w-set" data-id="${w.id}" data-f="verdict" data-v="${k}" aria-pressed="${w.verdict===k}">${n}</button>`).join('')}</div>
 <div class="row mt12"><select data-act-change="w-link" data-id="${w.id}" aria-label="Принять в ядро"><option value="">Принять: связать с мотивом…</option>${(S.road.motives||[]).map(m=>`<option value="${m.id}">${esc(short(m.formula,60))}</option>`).join('')}<option value="__new">+ Новый мотив из истинных компонентов</option></select><button class="btn small" data-act="w-lstep" data-id="${w.id}" data-d="up">Поднять уровень</button><button class="btn small" data-act="w-quar" data-id="${w.id}">Карантин</button><button class="btn small ghost" data-act="w-release" data-id="${w.id}">Отпустить</button>${(w.motives||[]).length?`<button class="btn small primary" data-act="rev-from" data-id="${w.motives[0]}">Обратный ход к цели →</button>`:''}</div></section>`}
 ${(w.motives||[]).length?`<p class="small mt8">Связано с мотивами: ${w.motives.map(id=>motiveById(id)).filter(Boolean).map(m=>`<button class="link" data-act="el-open" data-ref="v:${m.id}">${esc(short(m.formula,50))}</button>`).join(', ')}</p>`:''}
 ${w.status==='quar'?`<div class="block"><h3>Выход из карантина</h3><p class="small">Пересмотр: <input type="date" data-wf="${w.id}|quarUntil" data-key="wqd" value="${esc(w.quarUntil||'')}" style="width:auto"></p><ul class="small"><li>Желание сохранилось после охлаждения</li><li>Пройден быстрый путь — три вопроса</li><li>Есть одно поведенческое свидетельство: малое пробное действие</li></ul></div>`:''}`;
}

/* ---------- DASH › Ядро мотивов ---------- */
function quadSVG(){const ms=S.road.motives||[];const W=360,P=34;let s=`<svg viewBox="0 0 ${W} ${W}" class="quad" role="img" aria-label="Важность и дефицит мотивов"><rect x="${P}" y="8" width="${(W-P-8)/2}" height="${(W-P-8)/2}" class="qz q2"/><rect x="${P+(W-P-8)/2}" y="8" width="${(W-P-8)/2}" height="${(W-P-8)/2}" class="qz q1"/><rect x="${P}" y="${8+(W-P-8)/2}" width="${(W-P-8)/2}" height="${(W-P-8)/2}" class="qz q3"/><rect x="${P+(W-P-8)/2}" y="${8+(W-P-8)/2}" width="${(W-P-8)/2}" height="${(W-P-8)/2}" class="qz q4"/>
 <text x="${W-12}" y="22" text-anchor="end" class="qt">кормить сейчас</text><text x="${P+6}" y="22" class="qt">уже накормлен</text><text x="${W-12}" y="${W-P-6}" text-anchor="end" class="qt">проверить важность</text><text x="${P+6}" y="${W-P-6}" class="qt">фон</text><text x="${(W+P)/2}" y="${W-8}" text-anchor="middle" class="qa">дефицит →</text><text x="12" y="${(W-P)/2}" transform="rotate(-90 12 ${(W-P)/2})" text-anchor="middle" class="qa">важность →</text>`;
 const sz=W-P-8;ms.forEach(m=>{const x=P+(+m.def||0)/10*sz,y=8+sz-(+m.imp||0)/10*sz;s+=`<g data-act="el-open" data-ref="v:${m.id}" class="qp"><circle cx="${x}" cy="${y}" r="${7+Math.min(6,goalsFeeding(m.id).length*2)}"/><text x="${x+10}" y="${y+4}">${esc(short(m.formula,22))}</text></g>`;});return s+'</svg>';}
function coreHTML(){
 const ms=(S.road.motives||[]).slice().sort((a,b)=>mvPrio(b)-mvPrio(a)),cov=new Set(ms.flatMap(m=>m.clusters||[]));
 return `<header class="mhead"><div><h1>Ядро мотивов ${H('core')}</h1><p class="muted">Небольшой набор личных мотивов. Кормить сейчас нужно то, где высоки и важность, и дефицит. Важность пересматривается раз в квартал, дефицит — раз в месяц.</p></div><div class="row"><button class="btn small" data-act="mv-add">+ Мотив</button><button class="btn small" data-act="mv-stories">Кристаллизовать историями</button></div></header>
 ${mvMetricsHTML()}
 <div class="coregrid"><div>${quadSVG()}<p class="small muted">Не покрыты потребности карты: ${CL.filter(c=>!cov.has(c.id)).map(c=>c.n).join(', ')||'все покрыты'}.</p></div>
 <div class="mvlist">${ms.map(m=>{const lv=mvLevel(m),d=mvDebt(m);return `<button class="mvcard" data-act="el-open" data-ref="v:${m.id}"><div class="mv-h"><span class="mvl l-${lv}">${MLEV[lv]}</span><b>${num(mvPrio(m))}</b>${d?`<span class="warnt small">долг ${d}</span>`:''}</div><div class="mv-f">${esc(m.formula||'Без формулы')}</div><div class="small muted">${(m.clusters||[]).map(c=>clById(c)?.n).filter(Boolean).join(', ')||'потребность не указана'} · свидетельств ${(m.ev||[]).length} · целей ${goalsFeeding(m.id).length}</div></button>`;}).join('')||'<p class="muted">Ядро пусто. Начни с историй или с разбора желаний.</p>'}</div></div>
 ${ms.length>10?'<p class="hint">Мотивов больше десяти — почти наверняка в ядро попали способы. Проверь их фильтром «Уровень».</p>':''}`;
}

 const list=(k,n,h)=>`<div class="mvl2"><div class="lrow"><div class="lbl">${n}</div>${h?HT(n,h):''}</div>${(m[k]||[]).map((x,i)=>`<div class="deprow"><span>${esc(x.t||x)}</span><button class="icon" data-act="mv-ldel" data-id="${m.id}" data-k="${k}" data-i="${i}" aria-label="Удалить">×</button></div>`).join('')}<div class="row"><input type="text" data-ubind="mvl_${k}" data-key="mvl.${k}" placeholder="Добавить" aria-label="${n}"><button class="btn small" data-act="mv-ladd" data-id="${m.id}" data-k="${k}">+</button></div></div>`;

 <header class="gp-head" style="--sc:var(--hill)"><div class="ellabels"><span class="mvl l-${lv}">${MLEV[lv]}</span>${H('mvlevel')}<span class="small muted">Уровень считается по свидетельствам: слова → поведение → три из четырёх источников → полгода с рабочими способами и обходами. ИИ уровень не поднимает.</span></div>
 <div class="form mt8">${fld('formula','Формула','Мотив своими словами, одно предложение.')}</div>
 <div class="ellabels"><span class="lbl2">Потребности карты</span>${CL.map(c=>`<button class="pill" data-act="mv-cl" data-id="${m.id}" data-v="${c.id}" aria-pressed="${(m.clusters||[]).includes(c.id)}">${esc(c.n)}</button>`).join('')}</div>
 <div class="mvsl"><label>Важность <b data-uv="mv:${m.id}:imp">${m.imp??'—'}</b><input type="range" min="0" max="10" value="${m.imp??5}" data-mv="${m.id}|imp" data-key="mvi"></label><label>Дефицит <b data-uv="mv:${m.id}:def">${m.def??'—'}</b><input type="range" min="0" max="10" value="${m.def??5}" data-mv="${m.id}|def" data-key="mvd"></label><span class="small">Приоритет: <b>${num(mvPrio(m))}</b></span>${mvDebt(m)?`<span class="warnt small">Долг мотива: обходится дольше окна — перестраивай способы, а не волю</span>`:''}</div></header>
 <div class="gp-grid"><div class="gp-main"><section class="gp-sec"><h3>Паспорт ${H('passport')}</h3><div class="form">${fld('pull','Центральная тяга','Какой результат радует по-настоящему.')}${fld('material','Материал','С чем хочется работать: звук, люди, идеи, системы.')}${fld('conditions','Условия','Что зажигает: вызов, свобода, срок, публика, тишина.')}${fld('role','Роль','Один, в паре, ведущий, поддерживающий.')}${fld('dose','Доза','Где «мало», «достаточно» и «перебор».')}${fld('signals','Сигналы','По чему узнать дефицит и перекорм.')}</div></section>
 <section class="gp-sec">${list('ways','Рабочие способы','Что доказанно кормит этот мотив.')}${list('anti','Анти-список','Что казалось, но не накормило.')}${list('bypasses','Обходы','Что срабатывает, когда мотив мешает.')}</section>
 <section class="gp-sec"><div class="lrow"><div class="lbl">Конфликты</div>${H('axes')}</div>${(S.road.motives||[]).filter(x=>x.id!==m.id).map(x=>`<button class="pill" data-act="mv-conf" data-id="${m.id}" data-v="${x.id}" aria-pressed="${(m.conflicts||[]).includes(x.id)}">${esc(short(x.formula,30))}</button>`).join('')||'<p class="muted small">Других мотивов нет.</p>'}</section></div>
 <aside class="gp-ai"><div class="aicol-h">Свидетельства ${H('evidence')}</div>${(m.ev||[]).map((e,i)=>`<div class="evr"><span class="chip">${EVT[e.type]}</span><span class="small">${esc(e.fact)}</span><span class="muted small">${fmtDate(e.at)}</span><button class="icon" data-act="mv-evdel" data-id="${m.id}" data-i="${i}" aria-label="Удалить">×</button></div>`).join('')||'<p class="muted small">Пока есть только слова.</p>'}
 <div class="seg wrap mt6">${Object.entries(EVT).map(([k,n])=>`<button data-act="mv-evt" data-v="${k}" aria-pressed="${(S.ui.evt||'beh')===k}">${n}</button>`).join('')}</div><textarea rows="2" class="mt6" data-ubind="evfact" data-key="evfact" placeholder="Факт: что делал, что чувствовал, чем кончилось">${esc(S.ui.evfact||'')}</textarea><button class="btn small mt6" data-act="mv-ev" data-id="${m.id}">Записать свидетельство</button>

}

/* ---------- PLAN › Обратный ход ---------- */
function revHTML(){
 const r=S.road.rev||{},ms=(S.road.motives||[]).slice().sort((a,b)=>mvPrio(b)-mvPrio(a)),m=motiveById(r.motiveId);
 const E=w=>{const feeds=[r.motiveId,...(w.feeds||[])].map(motiveById).filter(Boolean);const sum=feeds.reduce((a,x)=>a+mvPrio(x)/10*(x.id===r.motiveId?(+w.c||0.5):0.5),0);return (w.destroys||[]).length?0:Math.round(sum*(+w.p||0.5)/Math.max(1,+w.cost||3)*100)/100;};
 return `<header class="mhead"><div><h1>От мотива к цели ${H('reverse')}</h1><p class="muted">Цель проектируется от мотива: потребность → варианты способов → выбор по синергии и реальности → формулировка → препятствие и план. Верх упрямый, низ гибкий.</p></div></header>
 <section class="gp-sec"><h3>1. Мотив</h3><div class="row wrap">${ms.map(x=>`<button class="pill" data-act="rev-m" data-v="${x.id}" aria-pressed="${r.motiveId===x.id}">${esc(short(x.formula,40))} · ${num(mvPrio(x))}</button>`).join('')||'<span class="muted small">Ядро пусто — сначала разбери желания или добавь мотив в DASH.</span>'}</div></section>
 ${m?`<section class="gp-sec"><h3>2. Способы ${H('ways')}</h3><p class="small muted">3–5 вариантов, хотя бы один неочевидный. Оценка: E = Σ(приоритет × насколько кормит) × вероятность успеха ÷ цена. Разрушает хоть один мотив ядра — вето.</p>

function calibHTML(){
 const gs=S.road.goals,open=gs.filter(g=>g.forecast&&!g.fact&&['done','dropped'].includes(g.status)),pairs=gs.filter(g=>g.forecast&&g.fact),rel=gs.filter(g=>g.release);
 const bySrc={};pairs.forEach(g=>{const s=g.srcKind||'не указан';(bySrc[s]=bySrc[s]||[]).push(+g.fact.sat-+g.forecast.sat);});
 const fCnt={},sCnt={};rel.forEach(g=>{if(g.release.filter)fCnt[g.release.filter]=(fCnt[g.release.filter]||0)+1;if(g.srcKind)sCnt[g.srcKind]=(sCnt[g.srcKind]||0)+1;});

 return `<header class="mhead"><div><h1>Прогноз и факт ${H('calib2')}</h1><p class="muted">Петля калибровки, протокол отпускания и паттерны архива: вычеркнутые цели — главный датасет о своих ловушках.</p></div></header>

 <div class="block"><h3>Калибровка</h3>${pairs.length?`<p class="small">Средняя ошибка: <b>${num(Math.round(pairs.reduce((a,g)=>a+Math.abs(+g.fact.sat-+g.forecast.sat),0)/pairs.length*10)/10)}</b>. ${Object.entries(bySrc).map(([s,a])=>`${s}: ${a.reduce((x,y)=>x+y,0)/a.length>0?'недооценка':'переоценка'} на ${num(Math.abs(Math.round(a.reduce((x,y)=>x+y,0)/a.length*10)/10))}`).join('; ')}</p>`:'<p class="muted small">Появится после первой сверки.</p>'}</div>
 <div class="block"><h3>Паттерны архива</h3>${rel.length?`<p class="small">Отпущено целей: ${rel.length}. Чаще всего проваливался фильтр: ${Object.entries(fCnt).sort((a,b)=>b[1]-a[1]).map(([k,v])=>k+' — '+v).join(', ')||'—'}. Источники: ${Object.entries(sCnt).sort((a,b)=>b[1]-a[1]).map(([k,v])=>k+' — '+v).join(', ')||'—'}.</p>${S.ai?`<button class="btn small aibtn" data-act="arch-ai"${S.aiBusyRef==='arch'?' disabled':''}>✦ Найти паттерны</button>`:''}${S.road.archAI?`<div class="mt8">${aiBlockLite(S.road.archAI)}</div>`:''}`:'<p class="muted small">Отпущенных целей пока нет. Отпускай через протокол — так архив станет данными.</p>'}</div>
 <div class="block"><h3>Искажения желаний ${H('distort')}</h3><table class="mtab"><tbody>${DISTORT.map(d=>`<tr><td><b>${esc(d[0])}</b></td><td>${esc(d[1])}</td><td class="muted">${esc(d[2])}</td></tr>`).join('')}</tbody></table></div>`;

/* ---------- ИИ ---------- */
async function aiCleanQ(wid,d){
 const w=wishById(wid);if(!w||!S.ai||S.aiBusyRef)return;S.aiBusyRef='wl:'+wid+d;R.work();
 const steps=(w.ladder[d]||[]).map(s=>`В: ${s.q}\nО: ${s.a||''}`).join('\n');
 const prompt=`Ты ведёшь лестницу желания по принципам Clean Language: задаёшь только чистые вопросы, используя слова человека, без подсказок ответов и без интерпретаций. Наводящий вопрос имплантирует мотив, которого не было.\nНаправление: ${LADDER[d][0]}. Базовый вопрос: ${LADDER[d][1]}\nИсходное желание: «${w.text}»\nУже пройдено:\n${steps||'—'}\n${d==='up'?'Если ответ звучит как избегание («чтобы не…»), предложи перенести его в ветку «откуда» и спроси, к чему это ведёт.':''}\nОтветь только JSON: {"q":"следующий вопрос одной фразой, с его словами","stop":false,"why":"если пора остановиться — почему"} Пиши по-русски.`;
 try{const j=await S.ai.json(prompt,{modelTier:'default'});const w2=wishById(wid);if(w2){w2.ladder[d]=w2.ladder[d]||[];if(j.stop)toast('ИИ: пора остановиться — '+String(j.why||'').slice(0,80));else w2.ladder[d].push({q:String(j.q||LADDER[d][1]).slice(0,200),a:'',ai:true});touchR();}}catch(e){toast(aiErrText(e));aiGone(e);}finally{S.aiBusyRef=null;R.work();}
}
async function aiAlloy(wid){
 const w=wishById(wid);if(!w||!S.ai||S.aiBusyRef)return;S.aiBusyRef='wa:'+wid;R.work();
 const lad=Object.entries(w.ladder||{}).map(([d,s])=>LADDER[d][0]+': '+s.map(x=>x.a).filter(Boolean).join(' / ')).join('\n');
 const prompt=`Предложи гипотезу состава желания — какие компоненты в нём сплавлены. Это гипотеза, не вердикт; бережно, без диагнозов.\nЖелание: «${w.text}»\nЛестница:\n${lad}\nФильтры: ${Object.entries(w.filt||{}).map(([k,v])=>k+': '+v.v).join(', ')||'—'}\nПотребности карты: ${CL.map(c=>c.id+' — '+c.n).join('; ')}\nИсточники: Интерес, Интеграция, Осознанное принятие, Подражание, Интроекция, Давление, Компенсация.\nОтветь только JSON: {"alloy":[{"t":"компонент своими словами человека","cl":"id потребности","src":"источник","ver":"true|false","share":30}]} 3–5 компонентов, доли в сумме 100. Пиши по-русски.`;
 try{const j=await S.ai.json(prompt,{modelTier:'default'});const w2=wishById(wid);if(w2){w2.alloy=[...(w2.alloy||[]),...(j.alloy||[]).slice(0,6).map(a=>({t:String(a.t||''),cl:clById(a.cl)?a.cl:'',src:String(a.src||''),ver:a.ver==='false'?'false':'true',share:+a.share||'',ai:true}))];touchR();}}catch(e){toast(aiErrText(e));aiGone(e);}finally{S.aiBusyRef=null;R.work();}
}
async function aiWays(){
 const r=S.road.rev,m=r&&motiveById(r.motiveId);if(!m||!S.ai||S.aiBusyRef)return;S.aiBusyRef='rev';R.work();
 const prompt=`Сгенерируй 4 способа накормить личный мотив человека; один обязательно неочевидный. Предпочитай способы, которые кормят сразу несколько мотивов и не требуют внешней славы как самоцели.\nМотив: «${m.formula}»; потребности: ${(m.clusters||[]).map(c=>clById(c)?.n).join(', ')}; материал: ${m.material||'—'}; условия: ${m.conditions||'—'}; доза: ${m.dose||'—'}; рабочие способы: ${(m.ways||[]).map(x=>x.t||x).join('; ')||'—'}; анти-список: ${(m.anti||[]).map(x=>x.t||x).join('; ')||'—'}\nДругие мотивы ядра: ${(S.road.motives||[]).filter(x=>x.id!==m.id).map(x=>x.id+' — '+x.formula).join('; ')||'—'}\nОтветь только JSON: {"ways":[{"t":"способ","c":0.7,"p":0.6,"cost":2,"feeds":["id других мотивов"],"real":"что вознаграждает среда, ограничения, чего лишаешься"}]} Пиши по-русски.`;
 try{const j=await S.ai.json(prompt,{modelTier:'default'});const ok=id=>!!motiveById(id);r.ways=[...(r.ways||[]),...(j.ways||[]).slice(0,5).map(w=>({t:String(w.t||''),c:+w.c||'',p:+w.p||'',cost:+w.cost||'',feeds:(w.feeds||[]).filter(ok),destroys:[],real:String(w.real||''),ai:true}))];touchR();}catch(e){toast(aiErrText(e));aiGone(e);}finally{S.aiBusyRef=null;R.work();}
}
async function aiArch(){
 if(!S.ai||S.aiBusyRef)return;S.aiBusyRef='arch';R.work();
 const data=S.road.goals.filter(g=>g.release).map(g=>`${g.title} | потребность: ${clById(g.release.need)?.n||'—'} | фильтр: ${g.release.filter||'—'} | почему: ${g.release.why||'—'} | источник: ${g.srcKind||'—'}`).join('\n');
 try{const j=await S.ai.json(`Найди паттерны в архиве отпущенных целей: какие источники чаще дают вычеркнутые цели, какие потребности подменяются способами, какие компоненты повторяются. Бережно, как гипотезы.\n\n${data}\n\nОтветь только JSON: {"summary":"2–3 предложения","hypotheses":[{"text":""}]} Пиши по-русски.`,{modelTier:'default'});S.road.archAI={title:'Паттерны архива',summary:String(j.summary||''),hypotheses:(j.hypotheses||[]).slice(0,5)};touchR();}catch(e){toast(aiErrText(e));aiGone(e);}finally{S.aiBusyRef=null;R.work();}
}

/* ---------- действия ---------- */
const newWish=(text,type)=>{const w={id:uid(),text,sigType:type||'wish',status:'new',depth:'fast',q:{},ladder:{up:[],back:[],side:[],down:[]},filt:{},alloy:[],verdict:'',motives:[],created:Date.now()};S.road.wishes=S.road.wishes||[];S.road.wishes.push(w);return w;};
const newMotive=formula=>{const m={id:uid(),formula,clusters:[],imp:5,def:5,ev:formula?[{type:'words',fact:formula,at:Date.now()}]:[],ways:[],anti:[],bypasses:[],conflicts:[],debt:[],created:Date.now()};S.road.motives=S.road.motives||[];S.road.motives.push(m);return m;};
Object.assign(A,{
 'w-type':a=>{S.ui.wtype=a.dataset.v;R.work();},
 'w-add':()=>{const t=String(S.ui.wtext||'').trim();if(!t){focusKey('wtext');return;}const w=newWish(t,S.ui.wtype);S.ui.wtext='';touchR();A['el-open']({dataset:{ref:'w:'+w.id}});},
 'w-set':a=>{const w=wishById(a.dataset.id);if(!w)return;w[a.dataset.f]=a.dataset.v;if(a.dataset.f==='verdict'&&w.status==='new')w.status='parsed';touchR();R.work();},
 'w-lstep':a=>{const w=wishById(a.dataset.id);if(!w)return;const d=a.dataset.d,arr=w.ladder[d]=w.ladder[d]||[],last=arr.length?arr[arr.length-1].a:'';w.depth='deep';arr.push({q:d==='up'&&filled(last)?`А что тебе даст «${short(last,60)}»?`:d==='side'&&arr.length?'Что ещё дало бы то же самое?':LADDER[d][1],a:''});touchR();R.work();},
 'w-ldel':a=>{const w=wishById(a.dataset.id);if(!w)return;w.ladder[a.dataset.d].splice(+a.dataset.i,1);touchR();R.work();},
 'w-body':a=>{const w=wishById(a.dataset.id);if(!w)return;const s=w.ladder[a.dataset.d][+a.dataset.i];s.body=!s.body;touchR();R.work();},
 'w-upcl':el=>{const w=wishById(el.dataset.id);if(!w)return;w.ladder.up[+el.dataset.i].cl=el.value;touchR();R.work();},
 'w-clean':a=>aiCleanQ(a.dataset.id,a.dataset.d),
 'w-filt':a=>{const w=wishById(a.dataset.id);if(!w)return;w.filt=w.filt||{};const cur=(w.filt[a.dataset.f]||{}).v;w.filt[a.dataset.f]={v:cur===a.dataset.v?'':a.dataset.v};touchR();R.work();},
 'w-alloy-add':a=>{const w=wishById(a.dataset.id);if(!w)return;w.alloy=[...(w.alloy||[]),{t:'',cl:'',src:'',ver:'',share:''}];touchR();R.work();},
 'w-alloy-del':a=>{const w=wishById(a.dataset.id);if(!w)return;w.alloy.splice(+a.dataset.i,1);touchR();R.work();},
 'w-alloy':el=>{const w=wishById(el.dataset.id);if(!w)return;w.alloy[+el.dataset.i][el.dataset.f]=el.value;touchR();},
 'w-alloy-v':a=>{const w=wishById(a.dataset.id);if(!w)return;w.alloy[+a.dataset.i].ver=a.dataset.v;touchR();R.work();},
 'w-alloy-ai':a=>aiAlloy(a.dataset.id),
 'w-link':el=>{const w=wishById(el.dataset.id);if(!w||!el.value)return;let id=el.value;if(id==='__new'){const tr=(w.alloy||[]).filter(x=>x.ver==='true').map(x=>x.t).filter(Boolean);const m=newMotive(tr.length?tr.join('; '):((w.q||{}).why||w.text));tr.length&&(m.clusters=[...new Set((w.alloy||[]).filter(x=>x.ver==='true'&&x.cl).map(x=>x.cl))]);id=m.id;}w.motives=[...new Set([...(w.motives||[]),id])];w.status='accepted';const m=motiveById(id);if(m)m.ev=[...(m.ev||[]),{type:'words',fact:'Желание: '+w.text,at:Date.now()}];touchR();R.work();toast('Связано с мотивом ядра');},
 'w-quar':a=>{const w=wishById(a.dataset.id);if(!w)return;w.status='quar';const d=new Date(Date.now()+(S.road.qDays||21)*DAY);w.quarUntil=d.toISOString().slice(0,10);touchR();R.work();toast('В карантине до '+w.quarUntil);},

const _guide8=guideHTML;
guideHTML=function(){return _guide8()+`<section class="gsec" id="g-motives"><h2>Карта мотивов</h2><p class="muted">13 потребностей в четырёх слоях — синтез теории самодетерминации, Маслоу и Кенрика, Макс-Ниффа, Рейсса, Шварца, Макклелланда, Панксеппа, Граве, PERMA и Франкла. Это словарь для точки остановки в лестнице «зачем», чек-лист покрытия ядра и источник гипотез — не анкета.</p>
 <div class="tblwrap"><table class="mtab"><thead><tr><th>Потребность</th><th>Суть</th><th>Здоровая форма</th><th>Ловушка</th><th>Сигнал дефицита</th><th>Насыщение</th><th>Уровень пирамиды</th></tr></thead><tbody>${['Сохранение','Связь','Действие','Целостность'].map(l=>`<tr><td colspan="7"><b>${l}</b></td></tr>`+CL.filter(c=>c.layer===l).map(c=>`<tr><td><b>${esc(c.n)}</b></td><td>${esc(c.core)}</td><td>${esc(c.ok)}</td><td>${esc(c.trap)}</td><td>${esc(c.def)}</td><td>${esc(c.sat)}</td><td>${esc(NEEDS[c.need].name)}</td></tr>`).join('')).join('')}</tbody></table></div>
 <p class="small">Гнев отдельной потребностью не считается: это охранная система, которая включается, когда нарушена другая потребность — чаще автономия, статус или безопасность. Если голод растёт от кормления, а наполнения нет, скорее всего это псевдо-удовлетворитель или компенсация.</p>
 <h3>Оси напряжения</h3><ul class="small">${AXES.map(([a,b,t])=>`<li>${esc(clById(a).n)} ↔ ${esc(clById(b).n)} — «${esc(t)}»</li>`).join('')}</ul><p class="small muted">Конфликт внутри пары — норма, а не ошибка диагностики.</p></section>
 <section class="gsec" id="g-filters"><h2>Фильтры, вердикты, обходы</h2><p>Связь «сигнал → потребность → способ» проверяется восемью фильтрами. Единого балла истинности нет: фильтры меряют разные звенья. Фильтр «Синергия» при «разрушающем» — единственное вето; провалы уровня, источника и хватки требуют операции до попадания в план.</p>
 <div class="tblwrap"><table class="mtab"><thead><tr><th>Фильтр</th><th>Вопрос</th><th>Шкала</th><th>Провал → операция</th></tr></thead><tbody>${FILTERS.map(f=>`<tr><td><b>${esc(f.n)}</b></td><td>${esc(f.q)}</td><td>${esc(f.opts.join(' · '))}</td><td>${esc(f.op)}</td></tr>`).join('')}</tbody></table></div>
 <p><b>Вердикты:</b> ${Object.values(VERDICTS).join(', ')}. <b>Операции:</b> принять, поднять уровень, переформулировать, карантин, отпустить. <b>Быстрый путь:</b> «Что это мне даст?», «Чей это голос?», «Что ещё дало бы то же?».</p>
 <h3>Обходы — от дешёвых к дорогим</h3><ol class="small">${BYPASS.map(b=>`<li><b>${esc(b[0])}</b> — ${esc(b[1])}. Цена: ${esc(b[2])}.</li>`).join('')}</ol><p class="small">Сначала 1–3, затем 4–7, механизм 8 — точечно. Если конфликт повторяется — механизм 9. Обход ядрового мотива с высоким дефицитом копит долг; долг дольше окна — сигнал перестраивать способы или жизнь, а не наращивать волю.</p>
 <h3>Правило глубины</h3><p class="small">Быстрый путь до двух минут — для бытовых сигналов. Глубокий разбор — для целей дольше месяца или с заметной ценой. Иначе модуль повторит судьбу перегруженных инструментов.</p></section>`;};
